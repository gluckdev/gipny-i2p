[workspace]
resolver = "2"
members = [
    "core",
    "libcore",
    "agent",
    "bot-sdk",
    "tests/e2e-harness",
    "dht",
    "i2p-embed",
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde-big-array = "0.5"
bincode = "1.3"
thiserror = "2"
anyhow = "1"
rand = "0.10"
zeroize = { version = "1", features = ["derive"] }
ed25519-dalek = "3"
x25519-dalek = { version = "3", features = ["static_secrets"] }
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
hkdf = "0.13"
hmac = { version = "0.13", features = ["zeroize"] }
sha2 = { version = "0.11", features = ["zeroize"] }
argon2 = { version = "0.6", features = ["zeroize"] }
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
futures = "0.3"
libc = "0.2"

[profile.release]
# "s" over 3 for the app code: it is network-bound (i2p tunnels dominate
# latency), so we trade raw throughput for a smaller binary. The crypto crates
# below are pinned back to opt-level 3 — KDF/AEAD/curve math is the one place
# compiler opts translate directly into user-visible unlock/handshake time.
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
debug = 0
debug-assertions = false
panic = "abort"

# Explicit test/investigation build. Never used by the release workflow.
[profile.diagnostics]
inherits = "release"
debug = 1
debug-assertions = true
lto = false
strip = false

[profile.release.package.argon2]
opt-level = 3
[profile.release.package.blake2]
opt-level = 3
[profile.release.package.sha2]
opt-level = 3
[profile.release.package.digest]
opt-level = 3
[profile.release.package.hkdf]
opt-level = 3
[profile.release.package.hmac]
opt-level = 3
[profile.release.package.chacha20]
opt-level = 3
[profile.release.package.chacha20poly1305]
opt-level = 3
[profile.release.package.poly1305]
opt-level = 3
[profile.release.package.curve25519-dalek]
opt-level = 3
[profile.release.package.ed25519-dalek]
opt-level = 3
[profile.release.package.x25519-dalek]
opt-level = 3
