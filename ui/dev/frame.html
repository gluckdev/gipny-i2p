<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Same viewport contract as the app's index.html. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <title>gipny · preview frame</title>
    <script src="/theme-init.js"></script>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <!-- api.ts decides it runs under Tauri when it is first imported, before
         the mocks install their internals: mark the window as Tauri first. -->
    <script>window.__TAURI_INTERNALS__ = window.__TAURI_INTERNALS__ || {};</script>
    <!-- Installs a mocked Tauri backend, then boots the real app. -->
    <script type="module" src="/dev/mock.ts"></script>
  </body>
</html>
