name: i2p-embed

# libi2pd compiled into the process through our C shim (i2p-embed/): no SAM,
# no local port. Builds it against the distro's boost/OpenSSL and runs the
# live test — a router in the test process, two destinations, an echo over the
# real i2p network. Runs on every push that touches the crate, on any branch,
# so the C++ is checked without a PR (docs/plans/2026-09-24-embedded-i2pd.md).

on:
  push:
    paths: [ 'i2p-embed/**', 'libcore/**', 'tests/e2e-harness/**', '.github/workflows/i2p-embed.yml' ]
  pull_request:
    paths: [ 'i2p-embed/**', 'libcore/**', 'tests/e2e-harness/**', '.github/workflows/i2p-embed.yml' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: i2p-embed (in-process router, live)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: check out i2pd
        run: git submodule update --init --depth 1 third_party/i2pd
      - name: current reseed certificates (upstream i2pd now, not the pin)
        run: scripts/fresh-i2p-certs.sh "$RUNNER_TEMP/i2p-certs"
      - name: install boost, OpenSSL, zlib
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libboost-dev libboost-program-options-dev libssl-dev zlib1g-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # only main writes it — see .github/workflows/README.md
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: i2p-embed
      - name: build
        run: cargo build --release -p i2p-embed --tests
      - name: live test over i2p
        env:
          I2P_EMBED_TEST_DIR: ${{ runner.temp }}/i2p-embed
        run: |
          set -o pipefail
          cargo test --release -p i2p-embed -- --ignored --nocapture 2>&1 | tee live.txt
      - name: summary
        if: always()
        run: |
          {
            echo '### i2p-embed live test'
            echo '```'
            grep -aE "ready in|connected in|echo in|test result|panicked|error" live.txt | head -40 || echo 'no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # macOS: Homebrew's boost and OpenSSL, linked in statically (a user's Mac has
  # neither), as .github/scripts/build-i2pd-macos.sh does for the old binary.
  macos:
    name: i2p-embed on macOS (${{ matrix.os }}, live)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v7
      - name: check out i2pd
        run: git submodule update --init --depth 1 third_party/i2pd
      - name: current reseed certificates (upstream i2pd now, not the pin)
        run: scripts/fresh-i2p-certs.sh "$RUNNER_TEMP/i2p-certs"
      - name: boost and OpenSSL from Homebrew
        run: |
          brew install boost openssl@3
          b="$(brew --prefix boost)"; o="$(brew --prefix openssl@3)"
          echo "I2P_EMBED_INCLUDE_DIRS=$b/include:$o/include" >> "$GITHUB_ENV"
          echo "I2P_EMBED_LIB_DIRS=$b/lib:$o/lib" >> "$GITHUB_ENV"
          echo "I2P_EMBED_STATIC_LIBS=boost_program_options,ssl,crypto" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - name: build
        run: cargo build --release -p i2p-embed --tests
      - name: links nothing outside the OS
        run: |
          bin="$(ls target/release/deps/live-* | grep -v '\.d$' | head -1)"
          otool -L "$bin"
          foreign="$(otool -L "$bin" | tail -n +2 | awk '{print $1}' | grep -vE '^(/usr/lib/|/System/Library/)' || true)"
          [ -z "$foreign" ] || { echo "links what a user's Mac does not have: $foreign"; exit 1; }
      - name: live test over i2p
        env:
          I2P_EMBED_TEST_DIR: ${{ runner.temp }}/i2p-embed
        run: |
          set -o pipefail
          cargo test --release -p i2p-embed -- --ignored --nocapture 2>&1 | tee live.txt

  # Windows: MSVC (the toolchain the app builds with), boost and OpenSSL from
  # vcpkg as static libraries against the dynamic CRT Rust uses.
  windows:
    name: i2p-embed on Windows (MSVC, live)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      VCPKG_TRIPLET: x64-windows-static-md
    steps:
      - uses: actions/checkout@v7
      - name: check out i2pd
        shell: bash
        run: git submodule update --init --depth 1 third_party/i2pd
      - name: current reseed certificates (upstream i2pd now, not the pin)
        shell: bash
        run: scripts/fresh-i2p-certs.sh "$RUNNER_TEMP/i2p-certs"
      - name: restore vcpkg packages
        id: vcpkg-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/vcpkg-installed
          key: vcpkg-${{ env.VCPKG_TRIPLET }}-${{ hashFiles('.github/workflows/i2p-embed.yml') }}
      - name: boost and OpenSSL from vcpkg
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install --triplet "$VCPKG_TRIPLET" \
            --x-install-root="$RUNNER_TEMP/vcpkg-installed" \
            boost-asio boost-program-options boost-algorithm boost-property-tree \
            boost-system boost-lexical-cast boost-beast boost-atomic boost-smart-ptr \
            openssl zlib
      - name: point the build at them
        shell: bash
        run: |
          root="$RUNNER_TEMP/vcpkg-installed/$VCPKG_TRIPLET"
          ls "$root/lib"
          # vcpkg's boost library names carry the toolset; take what is there.
          po="$(cd "$root/lib" && ls boost_program_options*.lib | head -1)"
          libs="${po%.lib},libssl,libcrypto,zlib"
          for extra in boost_atomic; do
            f="$(cd "$root/lib" && ls $extra*.lib 2>/dev/null | head -1 || true)"
            [ -n "$f" ] && libs="$libs,${f%.lib}"
          done
          echo "libraries: $libs"
          {
            echo "I2P_EMBED_INCLUDE_DIRS=$(cygpath -w "$root/include")"
            echo "I2P_EMBED_LIB_DIRS=$(cygpath -w "$root/lib")"
            echo "I2P_EMBED_LIBS=$libs"
          } >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - name: build
        shell: bash
        run: cargo build --release -p i2p-embed --tests
      - name: live test over i2p
        shell: bash
        env:
          I2P_EMBED_TEST_DIR: ${{ runner.temp }}/i2p-embed
        run: |
          set -o pipefail
          cargo test --release -p i2p-embed -- --ignored --nocapture 2>&1 | tee live.txt

  # The oldest system the Linux bundles support (their glibc floor): does
  # libi2pd build against its boost (1.74), and link boost statically?
  jammy:
    name: i2p-embed builds on Ubuntu 22.04 (boost 1.74, static)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: check out i2pd
        run: git submodule update --init --depth 1 third_party/i2pd
      - name: install boost, OpenSSL, zlib
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libboost-dev libboost-program-options-dev libssl-dev zlib1g-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: build
        env:
          I2P_EMBED_STATIC_LIBS: boost_program_options
        run: |
          export I2P_EMBED_LIB_DIRS="/usr/lib/$(gcc -dumpmachine)"
          cargo build --release -p i2p-embed --tests
          ldd target/release/deps/live-* | grep -iE "boost|ssl|crypto|libz" || true

  # Two bots with their built-in relays, all on the router inside the harness
  # process: no i2pd process, no SAM, no port. The same scenario as
  # "e2e (relays inside the bots)" in e2e-i2pd.yml.
  e2e:
    name: e2e on the in-process router (relays inside the bots)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: check out i2pd
        run: git submodule update --init --depth 1 third_party/i2pd
      - name: install boost, OpenSSL, zlib
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libboost-dev libboost-program-options-dev libssl-dev zlib1g-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: i2p-embed-e2e
      - name: build the harness on the in-process router
        run: cargo build --release -p e2e-harness --features embedded-i2p
      - name: run
        env:
          E2E_IN_PROCESS_RELAYS: '1'
          E2E_N_MESSAGES: '5'
          E2E_TIMEOUT_SECS: '900'
          E2E_WORK_DIR: ${{ runner.temp }}/e2e
        run: |
          set -o pipefail
          ./target/release/e2e-harness 2>&1 | tee harness.log
          grep -q '\[e2e\] SUCCESS' harness.log
      - name: summary
        if: always()
        run: |
          {
            echo '### e2e on the in-process router'
            echo '```'
            grep -aE "router ready|relays up|relay-connect|RTT|SUCCESS|Error|panicked" harness.log | head -30 || echo 'no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

