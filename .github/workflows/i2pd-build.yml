name: i2pd-build

# Builds the i2pd router for the platforms gipny ships on, across more targets
# than the release path itself covers.
#
# Why i2pd: go-i2p never finishes building client tunnels, so it delivers
# nothing (#46, go-i2p#55). With i2pd underneath, the same relay, bots and
# harness deliver 5/5 messages over live i2p — see
# docs/i2p-transport-evaluation.md. Nothing in the Rust code changes: it speaks
# plain SAMv3 to whatever answers on 127.0.0.1:7656.
#
# Desktop comes from the i2pd repo directly (static link, so the bundle has no
# runtime dependencies). Android builds android-router/jni — the same i2pd
# sources plus gipny's two JNI entry points — into libi2pd.so, which is what
# GipnyService loads. i2pd-android is here for its dependency build scripts
# (boost, OpenSSL) and its DaemonAndroid wrapper, not for its own app.
#
# This workflow is the wide net: release.yml builds the router it actually ships
# on the release path. What only lives here is musl, armeabi-v7a and the second
# Android ABI, so upstream breakage surfaces before a tag needs it.

on:
  workflow_dispatch:
  # Weekly, not nightly. e2e-i2pd already builds the Linux router every night
  # as part of proving it delivers, so a nightly run here would build the same
  # binary twice for the same answer. What this job adds is the platforms that
  # test cannot cover — musl, Windows, the three Android ABIs — and "does
  # upstream still compile everywhere" does not change fast enough to ask daily.
  schedule:
    - cron: '17 1 * * 1'

permissions:
  contents: read

# Every job builds the submodule commits this repo pins, so a given commit of
# this repo always produces the same router. Tracking branch heads was tried and
# abandoned: it made the shipped router un-reproducible, and on 2026-07-20 it
# broke outright, taking every Android leg and the Windows leg with it. The pin
# moves deliberately, via e2e-i2pd.yml's bump job, and only after a run that
# actually delivered messages.
#
# One input is still unpinned: Boost-for-Android, a nested submodule this repo
# does not record. See BOOST_FOR_ANDROID_REV in the android job.

jobs:
  # --------------------------------------------------------------------------
  # Desktop: linux x86_64, statically linked against boost/openssl/zlib.
  # --------------------------------------------------------------------------
  linux:
    name: linux x86_64 (static)
    # Same image the release job builds the desktop bundles on. boost, openssl
    # and zlib are linked statically, but glibc cannot be — so the binary still
    # carries a minimum glibc, and building on a newer image than the release
    # uses would produce a router the app itself cannot run on older distros.
    # This is a real regression against today's Go router, which is built with
    # CGO_ENABLED=0 and depends on nothing at all. If it bites, the answer is a
    # musl build, not a newer runner.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: install build dependencies
        run: |
          sudo apt-get update
          # The -dev packages carry the .a archives USE_STATIC=yes links against.
          sudo apt-get install -y --no-install-recommends \
            build-essential libboost-program-options-dev libssl-dev zlib1g-dev

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: check out the pinned vendored sources
        run: |
          # Pinned, not --remote. Tracking branch heads meant two runs of the
          # same commit of *this* repo could produce different routers, and on
          # 2026-07-20 it simply broke: every Android leg and the Windows leg
          # died in these steps after upstream moved. The pin is advanced
          # deliberately by e2e-i2pd.yml's bump job, and only on a run that
          # actually delivered messages.
          git submodule update --init --recursive

          # actions/checkout clones submodules shallow, so `git describe` has no
          # tags to describe against — run 29696503988 died on "No tags can
          # describe". Both the version stamp and its check need them.
          git -C third_party/i2pd fetch --quiet --unshallow --tags origin || \
            git -C third_party/i2pd fetch --quiet --tags origin

          echo "i2pd:         $(git -C third_party/i2pd log --oneline -1)"
          echo "i2pd-android: $(git -C third_party/i2pd-android log --oneline -1)"

      - name: build
        working-directory: third_party/i2pd
        run: |
          # USE_UPNP is off: gipny only ever talks to a loopback SAM port, and
          # leaving UPnP out drops a dependency and a hole-punching side effect
          # nobody asked for.
          #
          # USE_GIT_VERSION stamps `git describe` into the binary. The submodule
          # tracks upstream's development branch, so "2.61.0" alone would not say
          # which of its commits this is; the stamp makes the binary name its own
          # source, and gives the check below something to compare against.
          #
          # TORRENTS=no: upstream's BitTorrent client and its JSON-RPC server are
          # compiled in by default and pull in boost_json. gipny never configures
          # them; building them only adds code and a dependency to ship.
          make USE_STATIC=yes USE_UPNP=no TORRENTS=no USE_GIT_VERSION=yes -j"$(nproc)"

      - name: verify
        working-directory: third_party/i2pd
        run: |
          EXPECTED="$(git describe --tags)"
          ACTUAL="$(./i2pd --version | head -1)"
          echo "expected source revision: $EXPECTED"
          echo "binary reports:           $ACTUAL"
          # Assert the binary was built from the revision this repo pins, rather
          # than trusting that whatever landed in the artifact is the right
          # thing. A stale or mismatched router is otherwise invisible.
          case "$ACTUAL" in
            *"$EXPECTED"*) echo "version check: OK" ;;
            *) echo "version check: FAILED — binary does not report the pinned revision"; exit 1 ;;
          esac

          # Unstripped this is ~116 MB of debug symbols we would ship to every
          # user (run 29695534157). The Android legs were already stripped,
          # which is why they came out at 11 MB.
          echo "--- size before strip ---"; ls -lh i2pd
          strip --strip-unneeded i2pd
          echo "--- size shipped ---"
          ls -lh i2pd
          echo "--- dynamic dependencies (want: libc/libm/libstdc++ only) ---"
          ldd ./i2pd || echo "(not a dynamic executable)"

      - uses: actions/upload-artifact@v7
        with:
          name: i2pd-linux-x86_64
          path: third_party/i2pd/i2pd
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Fully static musl build: one binary for every linux distribution.
  #
  # The glibc job above can only run where glibc is at least as new as the
  # builder's, which rules out Arch, Void, CentOS and anything older than the
  # runner. Rather than a job per distribution, link everything — libc included
  # — and ship a single file that depends on nothing. This is what makes the
  # bundled router as portable as today's Go one.
  # --------------------------------------------------------------------------
  linux-musl:
    name: linux x86_64 (static, musl)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: alpine:3.21
    steps:
      - name: install build dependencies
        run: |
          apk add --no-cache build-essential 2>/dev/null || \
            apk add --no-cache build-base
          apk add --no-cache git make g++ \
            boost-dev boost-static \
            openssl-dev openssl-libs-static \
            zlib-dev zlib-static

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: check out the pinned vendored sources
        run: |
          # Pinned, not --remote. Tracking branch heads meant two runs of the
          # same commit of *this* repo could produce different routers, and on
          # 2026-07-20 it simply broke: every Android leg and the Windows leg
          # died in these steps after upstream moved. The pin is advanced
          # deliberately by e2e-i2pd.yml's bump job, and only on a run that
          # actually delivered messages.
          # Inside the Alpine container the checkout is owned by another user.
          git config --global --add safe.directory '*'

          git submodule update --init --recursive

          # actions/checkout clones submodules shallow, so `git describe` has no
          # tags to describe against — run 29696503988 died on "No tags can
          # describe". Both the version stamp and its check need them.
          git -C third_party/i2pd fetch --quiet --unshallow --tags origin || \
            git -C third_party/i2pd fetch --quiet --tags origin

          echo "i2pd:         $(git -C third_party/i2pd log --oneline -1)"
          echo "i2pd-android: $(git -C third_party/i2pd-android log --oneline -1)"

      - name: build
        working-directory: third_party/i2pd
        run: |
          # -static rather than USE_STATIC=yes: that path hardcodes
          # /usr/lib/<triple> paths that do not exist on Alpine. Alpine's
          # *-static packages provide the archives, and -static also pulls in
          # musl itself, which is the whole point.
          make USE_UPNP=no TORRENTS=no USE_GIT_VERSION=yes LDFLAGS=-static -j"$(nproc)"

      - name: verify
        working-directory: third_party/i2pd
        run: |
          EXPECTED="$(git describe --tags)"
          ACTUAL="$(./i2pd --version | head -1)"
          echo "built from: $EXPECTED"
          echo "reports:    $ACTUAL"
          case "$ACTUAL" in
            *"$EXPECTED"*) echo "version check: OK" ;;
            *) echo "version check: FAILED"; exit 1 ;;
          esac
          echo "--- size before strip ---"; ls -lh i2pd
          strip --strip-unneeded i2pd
          echo "--- size shipped ---"; ls -lh i2pd
          # The point of this job: nothing dynamic, so it runs on any distro.
          if ldd ./i2pd 2>&1 | grep -qiE 'not a (valid )?dynamic|statically linked'; then
            echo "portability check: OK — fully static"
          else
            echo "portability check: FAILED — binary still has dynamic dependencies"
            ldd ./i2pd || true
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: i2pd-linux-x86_64-musl
          path: third_party/i2pd/i2pd
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # macOS, Apple Silicon and Intel. Homebrew supplies boost and openssl, linked
  # statically; .github/scripts/build-i2pd-macos.sh is shared with release.yml.
  # macos-14 is deprecated on GitHub's runners, so the floor is macOS 15.
  # --------------------------------------------------------------------------
  macos:
    name: macos ${{ matrix.arch }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runs-on: macos-15 }
          - { arch: x86_64, runs-on: macos-15-intel }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: unshallow the router sources (git describe needs tags)
        run: |
          git -C third_party/i2pd fetch --quiet --unshallow --tags origin || \
            git -C third_party/i2pd fetch --quiet --tags origin
          echo "i2pd: $(git -C third_party/i2pd log --oneline -1)"

      - name: build and verify
        run: .github/scripts/build-i2pd-macos.sh

      - name: check it is the architecture this leg claims
        run: test "$(lipo -archs third_party/i2pd/i2pd)" = "${{ matrix.arch }}"

      - uses: actions/upload-artifact@v7
        with:
          name: i2pd-macos-${{ matrix.arch }}
          path: third_party/i2pd/i2pd
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Windows: the release job ships an NSIS installer, so the router has to
  # exist for it too. msys2's mingw packages supply boost and openssl, which is
  # how upstream builds their own Windows releases.
  # --------------------------------------------------------------------------
  windows:
    name: windows x86_64
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: check out the pinned vendored sources
        run: |
          # Pinned, not --remote. Tracking branch heads meant two runs of the
          # same commit of *this* repo could produce different routers, and on
          # 2026-07-20 it simply broke: every Android leg and the Windows leg
          # died in these steps after upstream moved. The pin is advanced
          # deliberately by e2e-i2pd.yml's bump job, and only on a run that
          # actually delivered messages.
          git submodule update --init --recursive

          # actions/checkout clones submodules shallow, so `git describe` has no
          # tags to describe against — run 29696503988 died on "No tags can
          # describe". Both the version stamp and its check need them.
          git -C third_party/i2pd fetch --quiet --unshallow --tags origin || \
            git -C third_party/i2pd fetch --quiet --tags origin

          echo "i2pd:         $(git -C third_party/i2pd log --oneline -1)"
          echo "i2pd-android: $(git -C third_party/i2pd-android log --oneline -1)"

      - name: build
        working-directory: third_party/i2pd
        run: |
          # USE_WIN32_APP=no: the default builds the tray/GUI daemon, and gipny's
          # router is a background child process driven over SAM.
          #
          # No TORRENTS=no here: Makefile.mingw ignores it and links boost_json
          # unconditionally (MSYS2's boost ships it). The torrent code is compiled
          # but inert — it only starts from a tunnels.conf section gipny never
          # writes.
          make USE_UPNP=no USE_WIN32_APP=no USE_GIT_VERSION=yes -j"$(nproc)"

      - name: verify
        working-directory: third_party/i2pd
        run: |
          EXPECTED="$(git describe --tags)"
          ACTUAL="$(./i2pd.exe --version | head -1)"
          echo "expected source revision: $EXPECTED"
          echo "binary reports:           $ACTUAL"
          case "$ACTUAL" in
            *"$EXPECTED"*) echo "version check: OK" ;;
            *) echo "version check: FAILED — binary does not report the pinned revision"; exit 1 ;;
          esac
          echo "--- size before strip ---"; ls -lh i2pd.exe
          strip --strip-unneeded i2pd.exe
          echo "--- size shipped ---"; ls -lh i2pd.exe
          # Which mingw DLLs travel with it decides what the installer bundles.
          ldd ./i2pd.exe | grep -iv '/c/windows' || true

      - uses: actions/upload-artifact@v7
        with:
          name: i2pd-windows-x86_64
          path: third_party/i2pd/i2pd.exe
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Android: standalone executable per ABI, matching the ABIs the APK ships.
  #
  # i2pd itself carries no Android build; it lives in i2pd-android, whose
  # binary/jni builds boost, openssl and miniupnpc from source per ABI and then
  # runs ndk-build. That is slow (tens of minutes) but it is the upstream path,
  # not a homemade one.
  # --------------------------------------------------------------------------
  android:
    name: android ${{ matrix.abi }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # The one build input this repo does not record, now pinned. This is the
      # revision that produced the first libi2pd.so to build and export the JNI
      # entry points on all three ABIs (run 35061210535). Tracking master here
      # meant the Android router was the only part of the build that was not
      # reproducible from this repository alone.
      BOOST_FOR_ANDROID_REV: 7943955c4d11a5bd61381a8b200c28619323eb0f
    strategy:
      fail-fast: false
      matrix:
        # Same two the APK ships today: arm64-v8a for devices, x86_64 for the
        # emulator. `arch` is what the dependency scripts call it — they accept
        # arm64/x86_64/arm/x86 and silently ignore anything else (an unknown
        # argument falls through their `*)` case and builds nothing), while
        # ndk-build wants the ABI name.
        include:
          - abi: arm64-v8a
            arch: arm64
          - abi: x86_64
            arch: x86_64
          # 32-bit ARM is a measurement, not a commitment: the APK ships no
          # 32-bit ABI today (no armv7 Rust target, no 32-bit go-i2p .so), so
          # this leg only answers whether it builds and what it costs, for when
          # 32-bit device support is decided on its own merits.
          - abi: armeabi-v7a
            arch: arm
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: check out the pinned vendored sources
        run: |
          # Pinned, not --remote. Tracking branch heads meant two runs of the
          # same commit of *this* repo could produce different routers, and on
          # 2026-07-20 it simply broke: every Android leg and the Windows leg
          # died in these steps after upstream moved. The pin is advanced
          # deliberately by e2e-i2pd.yml's bump job, and only on a run that
          # actually delivered messages.
          git submodule update --init --recursive

          # actions/checkout clones submodules shallow, so `git describe` has no
          # tags to describe against — run 29696503988 died on "No tags can
          # describe". Both the version stamp and its check need them.
          git -C third_party/i2pd fetch --quiet --unshallow --tags origin || \
            git -C third_party/i2pd fetch --quiet --tags origin

          echo "i2pd:         $(git -C third_party/i2pd log --oneline -1)"
          echo "i2pd-android: $(git -C third_party/i2pd-android log --oneline -1)"

      - name: align the vendored sources
        working-directory: third_party/i2pd-android/binary/jni
        run: |
          # Build the i2pd revision this repo pins, not the one i2pd-android
          # happens to point at. The revision is read from our own submodule so
          # desktop and Android cannot end up on different code.
          I2PD_REV="$(git -C "$GITHUB_WORKSPACE/third_party/i2pd" rev-parse HEAD)"
          git -C i2pd fetch --tags --quiet origin
          git -C i2pd checkout --quiet "$I2PD_REV"
          echo "[i2pd] i2pd at $(git -C i2pd describe --tags) ($I2PD_REV)"

          # i2pd-android pins Boost-for-Android to a commit whose NDK whitelist
          # predates every NDK the runners ship — run 29695096389 was rejected
          # with "Undefined or not supported Android NDK version: 27.3". A later
          # revision accepts up to 28.2. Overriding it in our own build is
          # exactly why these are submodules of this repo.
          #
          # BOOST_FOR_ANDROID_REV pins it, and the resolved revision is printed
          # so a build can always be traced back to its sources.
          git -C boost fetch --depth 1 origin "$BOOST_FOR_ANDROID_REV"
          git -C boost checkout FETCH_HEAD

          # The dependency scripts hardcode API 16 for the 32-bit ABIs, which
          # NDK r26 and later dropped — run 29695534157's armeabi-v7a leg died
          # on "armv7a-linux-androideabi16-clang: not found" while the 64-bit
          # legs, which already ask for 21, built fine. 21 is the floor these
          # NDKs support and is still below the android-24 the build targets.
          sed -i 's/\bAPI=16\b/API=21/g' build_boost.sh build_openssl.sh build_miniupnpc.sh
          grep -n 'API=' build_boost.sh build_openssl.sh build_miniupnpc.sh | sort -u | head
          echo "[i2pd] Boost-for-Android at $(git -C boost log --oneline -1)"

      - name: resolve NDK
        env:
          # Pinned, not "whatever is newest". Boost-for-Android matches the NDK
          # version against a fixed list and refuses anything outside it: run
          # 29694856790 died on "Undefined or not supported Android NDK version:
          # 29.0", which is what the runners now ship by default. Its list ends
          # at 28.2, and 27.3 is also exactly the NDK build.yml uses for the APK,
          # so the router and the app are built with the same toolchain.
          NDK_VERSION: 27.3.13750724
        run: |
          NDK_DIR="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          if [ ! -d "$NDK_DIR" ]; then
            echo "[i2pd] NDK $NDK_VERSION not present, installing"
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" >/dev/null
          fi
          test -d "$NDK_DIR"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "[i2pd] using NDK $NDK_DIR"
          cat "$NDK_DIR/source.properties" || true

      # No miniupnpc: the JNI library is built without USE_UPNP, matching the
      # desktop build and the flags libcore/src/router.rs passes.
      - name: build dependencies (boost, openssl)
        working-directory: third_party/i2pd-android/binary/jni
        run: |
          ./build_boost.sh ${{ matrix.arch }}
          ./build_openssl.sh ${{ matrix.arch }}

          # The scripts exit 0 whether or not they built anything, so check the
          # outputs exist before spending half an hour on ndk-build.
          for lib in boost openssl; do
            if ! find "$lib" -name '*.a' | grep -q .; then
              echo "$lib produced no static libraries for ${{ matrix.arch }}"
              exit 1
            fi
          done

      # Our jni tree, not i2pd-android's: android-router/jni builds the same i2pd
      # sources into a JNI library exporting Java_app_gipny_GipnyService_*,
      # rather than the standalone executable binary/jni produces. That binary
      # has no JNI symbols, so GipnyService could never have loaded it.
      #
      # NDK_MODULE_PATH still points at binary/jni: that is where the dependency
      # scripts put boost and openssl, and where the i2pd sources sit.
      - name: build libi2pd.so
        run: |
          # APP_ABI in Application.mk is "all"; narrow it to the one ABI this
          # matrix leg is for. APP_PLATFORM there is android-16, which modern
          # NDKs no longer support — 24 matches what the app targets.
          "$ANDROID_NDK_HOME/ndk-build" \
            -C android-router/jni \
            -j"$(nproc)" \
            NDK_MODULE_PATH="$GITHUB_WORKSPACE/third_party/i2pd-android/binary/jni" \
            NDK_PROJECT_PATH="$GITHUB_WORKSPACE/android-router" \
            APP_ABI=${{ matrix.abi }} \
            APP_PLATFORM=android-24

      - name: verify and stage
        run: |
          LIB="android-router/libs/${{ matrix.abi }}/libi2pd.so"
          test -f "$LIB"
          NM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"

          # The whole point of this leg: the library must export the two symbols
          # GipnyService binds to. A library that builds but exports neither
          # produces an APK that installs and silently never connects, which is
          # exactly the failure this migration is ending.
          #
          # --dynamic, because ndk-build strips the copy it installs into libs/
          # and a plain nm then reports "no symbols". The dynamic symbol table is
          # also the right thing to assert: it is what the JVM resolves against
          # at runtime, so this checks the artifact that actually ships.
          for sym in Java_app_gipny_GipnyService_nativeStartSam \
                     Java_app_gipny_GipnyService_nativeStopSam; do
            if ! "$NM" --dynamic --defined-only "$LIB" | grep -q "$sym"; then
              echo "libi2pd.so does not export $sym"
              "$NM" --dynamic --defined-only "$LIB" | grep -i gipny || true
              exit 1
            fi
            echo "exports $sym"
          done

          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
            --strip-unneeded "$LIB"
          file "$LIB"
          ls -lh "$LIB"
          mkdir -p staged
          cp "$LIB" "staged/libi2pd.so"

      - uses: actions/upload-artifact@v7
        with:
          name: i2pd-android-${{ matrix.abi }}
          path: staged/libi2pd.so
          if-no-files-found: error
