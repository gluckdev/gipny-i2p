name: Project website

on:
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deployment' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Validate and build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate translations, paths and content policy
        run: node --test --test-isolation=none site/tests/site.test.mjs
      - name: Build public files
        run: node site/build.mjs _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          retention-days: 3

  deploy:
    name: Deploy reviewed main to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
        with:
          enablement: false
      - name: Deploy static artifact
        id: deployment
        uses: actions/deploy-pages@v5
