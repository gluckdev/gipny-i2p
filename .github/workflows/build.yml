name: build

# Compile check for the i2p fork: the Rust workspace, the frontend and the
# Android APK on GitHub-hosted runners. Full release artifacts (installers) are
# produced by release.yml on a tag. All builds are CI-only.
#
# Every binary compiles the i2p router in (i2p-embed), so the desktop and
# test jobs build libi2pd too, against the distro's boost. The Android APKs
# here link a stub instead (I2P_EMBED_STUB): the real libi2pd.so takes an hour
# of boost per ABI, and release.yml and i2p-embed.yml build it.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Rust workspace: libcore + relay + the Tauri app (compile check).
  # ---------------------------------------------------------------------------
  rust:
    name: rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: system deps (Tauri / gstreamer)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libunwind-dev libsoup-3.0-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # only main writes it — see .github/workflows/README.md
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # tauri-build calls copy_resources() unconditionally and tauri-utils errors
      # on a glob with no match, so "resources/i2pd*" must match something even
      # for a compile check. A placeholder is deliberate: this job proves our code
      # builds, and only release.yml ships a real router.
      - name: stage router placeholder (tauri.conf resources glob needs a match)
        run: |
          mkdir -p core/resources
          printf 'placeholder: build.yml is a compile check and ships nothing\n' \
            > core/resources/i2pd
      - name: i2pd sources and build deps (every binary compiles its router in)
        run: |
          git submodule update --init --depth 1 third_party/i2pd
          sudo apt-get update -qq
          sudo apt-get install -y -qq libboost-dev libboost-program-options-dev libssl-dev zlib1g-dev
      - name: build libcore + relay
        run: |
          cargo build --release -p gipny-libcore
          cargo build --release --manifest-path core/relay/Cargo.toml
      # The bot SDK, agent and the e2e harness call into libcore too.
      - name: build bot-sdk + agent + e2e harness
        run: cargo build --release -p gipny-bot -p gipny-agent -p e2e-harness
      - name: build app (frontend + tauri)
        run: |
          cd ui && npm ci && npm run build && cd ..
          cargo build --release -p gipny
      # The app crate has tests of its own now (the attachment sanitizer, and
      # that console uploads bypass it); only libcore's ran before. After the
      # build, so the frontend the build script wants already exists.
      - name: app crate tests
        run: cargo test --release -p gipny --lib

  # ---------------------------------------------------------------------------
  # macOS: the app and libcore's tests on Apple Silicon. The Rust is the same on
  # Intel, and release.yml bundles both; this is here so macOS-only breakage —
  # memory locking, paths, the bundler's platform code — shows up on a push
  # rather than on a release tag.
  # ---------------------------------------------------------------------------
  macos:
    name: macos (app + libcore tests)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # only main writes it — see .github/workflows/README.md
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v7
        with: { node-version: '20', cache: npm, cache-dependency-path: ui/package-lock.json }
      - name: stage router placeholder (tauri.conf resources glob needs a match)
        run: |
          mkdir -p core/resources
          printf 'placeholder: build.yml is a compile check and ships nothing\n' \
            > core/resources/i2pd
      - name: i2pd sources, boost and OpenSSL (the router is compiled in)
        run: |
          git submodule update --init --depth 1 third_party/i2pd
          brew install boost openssl@3
          b="$(brew --prefix boost)"; o="$(brew --prefix openssl@3)"
          {
            echo "I2P_EMBED_INCLUDE_DIRS=$b/include:$o/include"
            echo "I2P_EMBED_LIB_DIRS=$b/lib:$o/lib"
            echo "I2P_EMBED_STATIC_LIBS=boost_program_options,ssl,crypto"
            echo "MACOSX_DEPLOYMENT_TARGET=15.0"
          } >> "$GITHUB_ENV"
      - name: libcore tests
        run: cargo test --release -p gipny-libcore
      - name: build app (frontend + tauri)
        run: |
          cd ui && npm ci && npm run build && cd ..
          cargo build --release -p gipny
      # The app crate has tests of its own now (the attachment sanitizer, and
      # that console uploads bypass it); only libcore's ran before. After the
      # build, so the frontend the build script wants already exists.
      - name: app crate tests
        run: cargo test --release -p gipny --lib

  # ---------------------------------------------------------------------------
  # Rust tests: crypto core (X3DH, Double Ratchet, attachment chunks), vault
  # lifecycle, first-run recovery, KDF timing report.
  # Timing lines ([timing] …) are lifted into the job summary so unlock speed
  # is visible on every build.
  # ---------------------------------------------------------------------------
  tests:
    name: rust tests (crypto/vault/kdf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # only main writes it — see .github/workflows/README.md
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: i2pd sources and build deps (libcore and the relay compile the router in)
        run: |
          git submodule update --init --depth 1 third_party/i2pd
          sudo apt-get update -qq
          sudo apt-get install -y -qq libboost-dev libboost-program-options-dev libssl-dev zlib1g-dev
      # pipefail: GitHub runs `bash -e` without it, so `cargo test | tee` took
      # tee's exit status and this step could never fail, whatever the tests did.
      - name: run libcore tests
        run: |
          set -o pipefail
          cargo test --release -p gipny-libcore -- --nocapture 2>&1 | tee test-out.txt
      # The standalone relay's own tests: the wire-format golden bytes on its
      # bincode 2 side, and its storage. Nothing ran them before.
      - name: run relay tests
        run: cargo test --release --manifest-path core/relay/Cargo.toml
      - name: timing summary
        if: always()
        run: |
          {
            echo '### Vault / KDF timings'
            echo '```'
            grep -a "\[timing\]" test-out.txt || echo 'no timing lines captured'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Frontend type-check (classic UI).
  # ---------------------------------------------------------------------------
  ui:
    name: ui typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: cd ui && npm ci && npm run build

  # ---------------------------------------------------------------------------
  # Android integration: build installable debug APKs for arm64-v8a (real
  # devices) and x86_64 (emulator), compile armeabi-v7a (32-bit devices), and
  # assert the Rust cdylib is packaged for each ABI.
  #
  # Built with -PskipRouter and the stub shim, so these APKs carry no router
  # and cannot connect — they exist to prove the Kotlin/Rust/Tauri side
  # compiles, packages and starts. APKs that actually work come from
  # release.yml, which builds and links a real libi2pd.so.
  # ---------------------------------------------------------------------------
  android:
    name: android APK
    runs-on: ubuntu-22.04
    env:
      # No libi2pd.so here (an hour of boost per ABI): the shim's interface
      # over nothing (i2p-embed/shim/stub.c), so the app links and starts and
      # its router never does. release.yml and i2p-embed.yml build the real one.
      I2P_EMBED_STUB: '1'
    steps:
      - uses: actions/checkout@v7
      # The stub carries no router, but the certificates go in all the same:
      # upstream's current set, as every build compiles in.
      - name: current reseed certificates (upstream i2pd now, not the pin)
        run: scripts/fresh-i2p-certs.sh "$RUNNER_TEMP/i2p-certs"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android,armv7-linux-androideabi
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }
      # packages: the action's default is "tools platform-tools", and the
      # obsolete `tools` package was removed from Google's SDK repository —
      # the job dies with "Failed to find package 'tools'" before anything is
      # built. Everything this job needs is named here instead, which also keeps
      # us off `sdkmanager` directly — Google deprecated that CLI, and every run
      # said so.
      - uses: android-actions/setup-android@v4
        with: { packages: 'platform-tools ndk;27.3.13750724' }
      - name: point at the NDK and shim the binutils names
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"
          # openssl-src's Android build expects binutils-style `<triple>-ranlib`/
          # `<triple>-ar`; NDK r23+ ships only the llvm-* names. Shim them.
          # 32-bit ARM goes by two prefixes: arm-linux-androideabi for binutils
          # and armv7a-linux-androideabi for the clang wrappers.
          tc="$ANDROID_SDK_ROOT/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for triple in aarch64-linux-android x86_64-linux-android arm-linux-androideabi armv7a-linux-androideabi; do
            ln -sf "$tc/llvm-ranlib" "$tc/$triple-ranlib"
            ln -sf "$tc/llvm-ar" "$tc/$triple-ar"
          done
          echo "$tc" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # The APK job compiled the whole workspace and tauri-cli from scratch on
      # every push — the slowest job in CI by a wide margin.
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
          # only main writes it — see .github/workflows/README.md
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cache gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('core/gen/android/**/*.gradle*', 'core/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - uses: cargo-bins/cargo-binstall@main
      - name: install tauri-cli
        run: cargo binstall -y --locked tauri-cli@^2 || cargo install tauri-cli --version '^2' --locked
      - name: build frontend
        run: cd ui && npm ci && npm run build
      # tauri builds every requested target into the "universal" flavor output
      # (outputs/apk/universal/debug/app-universal-debug.apk), so a second
      # `--target` build overwrites the first APK. Build one ABI at a time,
      # verify + stash the APK, and wipe outputs/ before the next build.
      - name: build Android APK (aarch64)
        env:
          # Not `-- -PskipRouter`: the tauri CLI does not forward trailing args
          # to Gradle. ORG_GRADLE_PROJECT_* is read by project.hasProperty().
          ORG_GRADLE_PROJECT_skipRouter: 'true'
        run: cd core && cargo tauri android build --debug --apk --target aarch64
      - name: verify + stash APK (aarch64)
        run: |
          apk="$(find core/gen/android/app/build/outputs -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/libgipny_lib.so'
          mkdir -p dist/arm64
          find core/gen/android/app/build/outputs -type f -name '*.apk' -exec cp {} dist/arm64/ \;
          ls -la dist/arm64
          test -n "$(find dist/arm64 -type f -name '*.apk' -print -quit)"
          rm -rf core/gen/android/app/build/outputs
      - name: build Android APK (x86_64)
        env:
          ORG_GRADLE_PROJECT_skipRouter: 'true'
        run: cd core && cargo tauri android build --debug --apk --target x86_64
      - name: verify + stash APK (x86_64)
        run: |
          apk="$(find core/gen/android/app/build/outputs -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          unzip -l "$apk" | grep -F 'lib/x86_64/libgipny_lib.so'
          mkdir -p dist/x86_64
          find core/gen/android/app/build/outputs -type f -name '*.apk' -exec cp {} dist/x86_64/ \;
          ls -la dist/x86_64
          test -n "$(find dist/x86_64 -type f -name '*.apk' -print -quit)"
          rm -rf core/gen/android/app/build/outputs
      # 32-bit ARM ships in release.yml; compiling it here is what catches code
      # that only breaks where usize is 32 bits, on a push rather than a tag.
      - name: build Android APK (armv7)
        env:
          ORG_GRADLE_PROJECT_skipRouter: 'true'
        run: cd core && cargo tauri android build --debug --apk --target armv7
      - name: verify APK (armv7)
        run: |
          apk="$(find core/gen/android/app/build/outputs -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          unzip -l "$apk" | grep -F 'lib/armeabi-v7a/libgipny_lib.so'
      - uses: actions/upload-artifact@v7
        with:
          name: gipny-android-debug-apk-no-router
          path: dist/arm64/*.apk
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: gipny-android-debug-apk-x86_64-no-router
          path: dist/x86_64/*.apk
          retention-days: 3
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Android emulator smoke: install the x86_64 debug APK on a cold emulator,
  # assert the app and GipnyService start, and report cold-start time and PSS.
  #
  # The APK is built with -PskipRouter, so there is no i2pd in it and nothing
  # here can say anything about the transport — the service is expected to log
  # that the library is missing. Delivery is measured by e2e-i2pd.yml.
  # continue-on-error: true so a flaky emulator never breaks the main build.
  # ---------------------------------------------------------------------------
  android-smoke:
    name: android emulator smoke
    needs: android
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }
      # packages: the action's default is "tools platform-tools", and the
      # obsolete `tools` package was removed from Google's SDK repository —
      # the job dies with "Failed to find package 'tools'" before anything is
      # built. Everything this job needs is named here instead, which also keeps
      # us off `sdkmanager` directly — Google deprecated that CLI, and every run
      # said so.
      - uses: android-actions/setup-android@v4
        with: { packages: 'platform-tools emulator system-images;android-33;google_apis;x86_64' }
      - name: create the avd
        run: |
          echo "no" | avdmanager create avd \
            -n smoke \
            -k "system-images;android-33;google_apis;x86_64" \
            --force
      - uses: actions/download-artifact@v8
        with:
          name: gipny-android-debug-apk-x86_64-no-router
          path: apk-x86_64
      # Without KVM the x86_64 emulator runs unaccelerated and never finishes
      # booting: every run of this job to date died on "Timeout waiting for
      # emulator to boot", and continue-on-error kept the workflow green over
      # it. The runners have /dev/kvm; only its permissions stand in the way.
      # chmod rather than the usual udev rule: this image has no
      # /etc/udev/rules, and the job only lives for one boot anyway.
      - name: enable KVM
        run: |
          test -e /dev/kvm || { echo "no /dev/kvm on this runner"; exit 1; }
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
      - name: emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          avd-name: smoke
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          # One command: the runner runs each line of a script in its own shell.
          script: bash .github/scripts/android-smoke.sh
