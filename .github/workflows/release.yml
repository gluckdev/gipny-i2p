name: release

# Full release pipeline on GitHub Actions — no local docker/build.sh needed.
# Builds every desktop artifact (Linux AppImage/deb for amd64 and arm64,
# Windows NSIS, macOS dmg for Apple Silicon and Intel), the relay server and
# the agent for Linux amd64/arm64, and Android arm64 and armv7. Each runs the
# i2p router inside its own process (i2p-embed; android-router/jni on
# Android): no i2pd binary ships, nothing listens on a local port.
#
# Trigger: a push to main that changes the version (core/tauri.conf.json).
# That run builds everything, then tags the commit vX.Y.Z and publishes the
# release itself — do not push tags by hand. It runs on main because a run
# reads caches only from its own ref and main, and writes only to its own: a
# tag run's caches could never be read again, so every tagged release used to
# start cold (and a manual "seed the cache on main first" step kept being
# skipped). A manual run builds a preview and publishes nothing.

on:
  push:
    branches: [ main ]
    paths: [ 'core/tauri.conf.json' ]
  workflow_dispatch:

# One release build at a time; a second version bump waits for the first.
concurrency:
  group: release
  cancel-in-progress: false

# Least privilege by default; only the publish job elevates to write.
permissions:
  contents: read

# The relay network's seed nodes, baked into every client at compile time
# (`option_env!` in libcore/src/dht_client.rs). A repository variable, not a
# secret: the destinations are public, and each client ships them anyway.
# Set it from the destination relay-testnet prints once it runs with `--dht`.
env:
  GIPNY_DHT_SEEDS: ${{ vars.GIPNY_DHT_SEEDS }}

jobs:
  # ---------------------------------------------------------------------------
  # 0. Every place that carries the version must carry the same one, and a
  #    version is published once. Checked first, because finding out at
  #    publish time means hours of builds thrown away, and not finding out
  #    means assets named for one version on a release page for another.
  # ---------------------------------------------------------------------------
  version:
    name: versions agree
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compare.outputs.version }}
      publish: ${{ steps.compare.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - name: compare
        id: compare
        run: |
          want="$(jq -r .version core/tauri.conf.json)"
          ok=true
          for pair in \
            "ui/package.json=$(jq -r .version ui/package.json)" \
            "core/Cargo.toml=$(sed -nE '0,/^version *= *"([^"]+)"/s//\1/p' core/Cargo.toml)" \
            "agent/Cargo.toml=$(sed -nE '0,/^version *= *"([^"]+)"/s//\1/p' agent/Cargo.toml)"; do
            file="${pair%%=*}"; have="${pair#*=}"
            echo "$file: $have"
            [ "$have" = "$want" ] || { echo "  differs from core/tauri.conf.json ($want)"; ok=false; }
          done
          $ok
          echo "version=$want" >> "$GITHUB_OUTPUT"
          # Publish on a push to main, once per version: a rerun, or a later
          # push that touches the file without bumping, must not republish.
          if [ "$GITHUB_EVENT_NAME" = push ] && ! git ls-remote --exit-code --tags origin "refs/tags/v$want" >/dev/null; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "v$want: will be published"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "v$want: preview only (manual run, or the tag already exists)"
          fi

  # ---------------------------------------------------------------------------
  # 1. The i2pd binary, built from third_party/i2pd at the pinned commit, only
  #    to make the network snapshot below: every build compiles the router in
  #    (i2p-embed) and ships no i2pd.
  # ---------------------------------------------------------------------------
  router:
    name: router (i2pd, ${{ matrix.label }})
    needs: version
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is built against musl and fully static, so one file runs on
          # every distribution — Arch, Void, CentOS, Deepin — instead of
          # carrying a glibc floor from whatever image built it.
          - { label: linux/amd64, runs-on: ubuntu-latest, out: i2pd, artifact: router-linux-amd64 }
          # Only for the network database snapshot below: every build ships
          # the router compiled in.
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # USE_GIT_VERSION and the version check below both run `git describe
      # --tags`, and actions/checkout clones submodules shallow with no tags —
      # run 29696503988 died on exactly this ("No tags can describe"). Under
      # `set -e` a failing describe aborts the step, so this is not optional.
      - name: unshallow the router sources (git describe needs tags)
        shell: bash
        run: |
          git -C third_party/i2pd fetch --quiet --unshallow --tags origin || \
            git -C third_party/i2pd fetch --quiet --tags origin
          git -C third_party/i2pd describe --tags
          echo "I2PD_REV=$(git -C third_party/i2pd rev-parse HEAD)" >> "$GITHUB_ENV"

      # The router is the same binary for the same pinned revision, and that pin
      # only moves when e2e proves delivery — so building it five times per
      # release was five idle waits (4-11 minutes each) that everything
      # downstream sat behind. Keyed like the Android one: revision plus
      # everything that changes the output.
      - name: restore cached router
        id: router-cache
        uses: actions/cache@v6
        with:
          path: third_party/i2pd/${{ matrix.out }}
          key: i2pd-${{ matrix.artifact }}-${{ env.I2PD_REV }}-${{ hashFiles('.github/scripts/build-i2pd-macos.sh') }}-v1

      # Built from third_party/i2pd, not downloaded: a release must be
      # reproducible from this repository, and an upstream binary would also be
      # a binary nobody here reviewed. See docs/i2p-transport-evaluation.md for
      # why the router changed at all — go-i2p never delivered a message.
      - name: build (linux, static musl)
        if: steps.router-cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.21 sh -c '
            apk add --no-cache build-base git make g++ \
              boost-dev boost-static openssl-dev openssl-libs-static zlib-dev zlib-static
            git config --global --add safe.directory "*"
            cd third_party/i2pd
            make USE_UPNP=no TORRENTS=no USE_GIT_VERSION=yes LDFLAGS=-static -j"$(nproc)"
            strip --strip-unneeded i2pd
          '
          ldd third_party/i2pd/i2pd 2>&1 | grep -qiE 'not a (valid )?dynamic|statically linked' \
            || { echo "router is not static — it would not run on other distros"; exit 1; }
          ls -lh third_party/i2pd/i2pd

      # A release has to be able to say which source revision it shipped.
      # USE_GIT_VERSION stamps the binary; this asserts the stamp matches the
      # submodule, so the shipped router can be tied back to the revision the
      # e2e job proved delivers.
      - name: verify version stamp (linux)
        if: steps.router-cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: |
          EXPECTED="$(git -C third_party/i2pd describe --tags)"
          ACTUAL="$(third_party/i2pd/i2pd --version | head -1)"
          echo "expected: $EXPECTED"
          echo "actual:   $ACTUAL"
          case "$ACTUAL" in
            *"${EXPECTED#v}"*) echo "version check: OK" ;;
            *) echo "version check: FAILED — binary is not the pinned source"; exit 1 ;;
          esac

      - uses: msys2/setup-msys2@v2
        if: steps.router-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib

      - name: build (windows)
        if: steps.router-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cd third_party/i2pd
          # USE_WIN32_APP=no: Makefile.mingw defaults it to yes, which builds the
          # tray/GUI daemon with -mwindows. gipny's router is a background
          # process driven over SAM; the installer must not drop a tray icon and
          # a window on the user.
          #
          # No TORRENTS=no: Makefile.mingw ignores it and always links
          # boost_json. The torrent code stays inert — it only starts from a
          # tunnels.conf section gipny never writes.
          make USE_UPNP=no USE_WIN32_APP=no USE_GIT_VERSION=yes -j"$(nproc)"
          strip --strip-unneeded i2pd.exe
          ls -lh i2pd.exe
          ./i2pd.exe --version

      # Static against Homebrew's boost/openssl, stripped, ad-hoc signed, and
      # checked to link nothing outside the OS — shared with i2pd-build.yml.
      - name: build (macos)
        if: steps.router-cache.outputs.cache-hit != 'true' && runner.os == 'macOS'
        run: .github/scripts/build-i2pd-macos.sh

      # Shrink the bundled router. Linux only: UPX-packed Windows executables
      # routinely trip antivirus false positives.
      - name: compress router (UPX)
        if: steps.router-cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y upx-ucl
          # A static-pie binary is something UPX has historically refused; keep
          # the unpacked one if packing fails rather than shipping nothing.
          cp "third_party/i2pd/${{ matrix.out }}" /tmp/i2pd.unpacked
          if upx --best --lzma "third_party/i2pd/${{ matrix.out }}"; then
            # Packed binaries have to still run: an unrunnable router is a
            # client that never connects, and nothing downstream would notice.
            "third_party/i2pd/${{ matrix.out }}" --version \
              || { echo "UPX-packed router does not run — shipping the unpacked one"
                   cp /tmp/i2pd.unpacked "third_party/i2pd/${{ matrix.out }}"; }
          else
            echo "UPX declined this binary — shipping it unpacked"
            cp /tmp/i2pd.unpacked "third_party/i2pd/${{ matrix.out }}"
          fi
          ls -lh "third_party/i2pd/${{ matrix.out }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          retention-days: 5
          path: third_party/i2pd/${{ matrix.out }}

  # ---------------------------------------------------------------------------
  # 1b. A snapshot of the i2p network database, shipped with every client so a
  #     first start does not have to reseed. The freshly built router runs a
  #     few minutes on the runner (reseed, then exploration) and its netDb —
  #     public RouterInfos of other routers, nothing of ours — is packed. A
  #     client with an empty netDb lays it out before starting its router;
  #     stale entries are dropped by the router itself, and with too few left
  #     it still reseeds as usual. Never fails the release: a thin snapshot is
  #     still shipped, an empty one is simply not used.
  # ---------------------------------------------------------------------------
  netdb-seed:
    name: network database snapshot
    needs: router
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8
        with: { name: router-linux-amd64, path: router }
      - name: run the router and let it learn the network
        run: |
          chmod +x router/i2pd
          mkdir -p seed-dir
          ./router/i2pd --datadir="$PWD/seed-dir" --sam.enabled=false --http.enabled=false \
            --httpproxy.enabled=false --socksproxy.enabled=false --upnp.enabled=false \
            --notransit --log=file --logfile="$PWD/seed.log" &
          pid=$!
          for i in $(seq 1 36); do
            sleep 10
            n=$(find seed-dir/netDb -name 'routerInfo-*.dat' 2>/dev/null | wc -l)
            echo "after $((i*10)) s: $n routers known"
            [ "$n" -ge 2500 ] && break
          done
          kill "$pid"; sleep 5
          n=$(find seed-dir/netDb -name 'routerInfo-*.dat' | wc -l)
          echo "snapshot: $n routers"
          tar -czf i2pd-netdb-seed.tar.gz -C seed-dir/netDb .
          ls -lh i2pd-netdb-seed.tar.gz
          {
            echo "### network database snapshot"
            echo "$n routers, $(du -h i2pd-netdb-seed.tar.gz | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: netdb-seed
          retention-days: 5
          path: i2pd-netdb-seed.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2. Desktop: Linux amd64/arm64 (AppImage + deb), Windows (NSIS), macOS
  #    (dmg). All compile the router in (i2p-embed); only the network snapshot
  #    goes into core/resources.
  # ---------------------------------------------------------------------------
  desktop:
    name: desktop (${{ matrix.os }})
    needs: [router, netdb-seed]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every one runs the router inside the app (i2p-embed): no i2pd
          # binary, no SAM, no port. boost is linked in; OpenSSL and zlib from
          # the system on Linux, statically elsewhere (Homebrew; vcpkg, MSVC).
          - { os: ubuntu-22.04,     bundles: 'appimage,deb', artifact: gipny-Linux }
          # 22.04 like amd64, so the arm64 bundles carry the same glibc floor.
          - { os: ubuntu-22.04-arm, bundles: 'appimage,deb', artifact: gipny-Linux-arm64 }
          - { os: windows-latest,   bundles: 'nsis',         artifact: gipny-Windows }
          - { os: macos-15,         bundles: 'app,dmg',      artifact: gipny-macOS-arm64 }
          - { os: macos-15-intel,   bundles: 'app,dmg',      artifact: gipny-macOS-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: check out i2pd (compiled into the app)
        shell: bash
        run: git submodule update --init --depth 1 third_party/i2pd
      - name: current reseed certificates (upstream i2pd now, not the pin)
        shell: bash
        run: scripts/fresh-i2p-certs.sh "$RUNNER_TEMP/i2p-certs"
      # vcpkg builds boost for most of an hour; the result changes only with
      # the script (its package list) and the image's vcpkg.
      - name: restore boost and OpenSSL (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/vcpkg-installed
          key: vcpkg-x64-windows-static-md-${{ hashFiles('.github/scripts/vcpkg-i2p-deps.sh') }}
      - name: boost and OpenSSL (Windows, compiled into the app)
        if: runner.os == 'Windows'
        shell: bash
        run: .github/scripts/vcpkg-i2p-deps.sh "$RUNNER_TEMP/vcpkg-installed"
      - name: system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # ubuntu-22.04 image: preinstalled libunwind-14-dev conflicts with
          # libunwind-dev required by libgstreamer1.0-dev (runner-images#6399).
          sudo apt-get remove -y libunwind-14-dev || true
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libunwind-dev libsoup-3.0-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good libasound2-dev \
            libboost-dev libboost-program-options-dev zlib1g-dev
          # The router is compiled into the app; boost linked in, OpenSSL and
          # zlib from the system as every desktop has them.
          echo "I2P_EMBED_STATIC_LIBS=boost_program_options" >> "$GITHUB_ENV"
          echo "I2P_EMBED_LIB_DIRS=/usr/lib/$(gcc -dumpmachine)" >> "$GITHUB_ENV"
      # A user's Mac has neither: linked in statically, as i2p-embed.yml
      # checks. MACOSX_DEPLOYMENT_TARGET matches tauri.conf's
      # minimumSystemVersion (Homebrew's archives are built for the image's OS).
      - name: boost and OpenSSL (macOS, compiled into the app)
        if: runner.os == 'macOS'
        run: |
          brew install boost openssl@3
          b="$(brew --prefix boost)"; o="$(brew --prefix openssl@3)"
          {
            echo "I2P_EMBED_INCLUDE_DIRS=$b/include:$o/include"
            echo "I2P_EMBED_LIB_DIRS=$b/lib:$o/lib"
            echo "I2P_EMBED_STATIC_LIBS=boost_program_options,ssl,crypto"
            echo "MACOSX_DEPLOYMENT_TARGET=15.0"
          } >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # only main writes it — see .github/workflows/README.md
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v7
        with: { node-version: '20', cache: npm, cache-dependency-path: ui/package-lock.json }
      # Named i2pd-* so the existing resources glob picks it up.
      - name: stage the network database snapshot
        uses: actions/download-artifact@v8
        with:
          name: netdb-seed
          path: core/resources
      - name: build frontend
        run: cd ui && npm ci && npm run build
      - name: tauri build
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: core
          args: --bundles ${{ matrix.bundles }} --features embedded-i2p
      - name: the app links nothing a Mac lacks
        if: runner.os == 'macOS'
        run: |
          bin="$(find target/release/bundle/macos -path '*.app/Contents/MacOS/*' -type f | head -1)"
          test -n "$bin"
          otool -L "$bin"
          foreign="$(otool -L "$bin" | tail -n +2 | awk '{print $1}' | grep -vE '^(/usr/lib/|/System/Library/)' || true)"
          [ -z "$foreign" ] || { echo "links what a user's Mac does not have: $foreign"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          retention-days: 5
          # The app crate is a workspace member — cargo's target dir is at the
          # repo root, not under core/.
          if-no-files-found: error
          path: |
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.deb
            target/release/bundle/**/*-setup.exe
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.dmg

  # ---------------------------------------------------------------------------
  # 2b. Relay server for Linux amd64 and arm64: gipny-relay (the i2p router
  #     compiled in: no i2pd beside it, no SAM, no port) and its systemd unit,
  #     in one tarball. arm64 is here for the cheap always-on machines a relay
  #     actually runs on — a Raspberry Pi, an ARM VPS.
  # ---------------------------------------------------------------------------
  relay:
    name: relay (linux ${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 sets the glibc floor at 2.35: Debian 12, Ubuntu 22.04 and
          # Raspberry Pi OS bookworm all meet it.
          - { arch: amd64, runs-on: ubuntu-22.04 }
          - { arch: arm64, runs-on: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # only main writes it — see .github/workflows/README.md
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: core/relay
      - name: i2pd sources and build deps (the relay compiles its router in)
        run: |
          git submodule update --init --depth 1 third_party/i2pd
          sudo apt-get update -qq
          sudo apt-get install -y -qq libboost-dev libboost-program-options-dev libssl-dev zlib1g-dev
      - name: current reseed certificates (upstream i2pd now, not the pin)
        run: scripts/fresh-i2p-certs.sh "$RUNNER_TEMP/i2p-certs"
      - name: build and package
        run: |
          export I2P_EMBED_STATIC_LIBS=boost_program_options
          export I2P_EMBED_LIB_DIRS="/usr/lib/$(gcc -dumpmachine)"
          cargo build --release --manifest-path core/relay/Cargo.toml
          VERSION="$(jq -r .version core/tauri.conf.json)"
          name="gipny-relay_${VERSION}_linux-${{ matrix.arch }}"
          mkdir -p "dist/$name"
          install -m 0755 core/relay/target/release/gipny-relay "dist/$name/"
          install -m 0644 core/relay/gipny-relay.service "dist/$name/"
          # Must run on the architecture this tarball is named for.
          file "dist/$name/gipny-relay"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ls -lh dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: gipny-relay-linux-${{ matrix.arch }}
          retention-days: 5
          path: dist/*.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2c. Headless agent: gipny-agent (the i2p router compiled in, no SAM, no
  #     port), the network snapshot beside it and a systemd unit, as a tar.gz
  #     for Linux amd64 and arm64.
  # ---------------------------------------------------------------------------
  agent:
    name: agent (linux ${{ matrix.arch }})
    needs: [version, netdb-seed]
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runs-on: ubuntu-22.04 }
          - { arch: arm64, runs-on: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@v7
      # The router is compiled into the agent: no i2pd binary, no SAM, no port.
      - name: check out i2pd and install what it builds against
        run: |
          git submodule update --init --depth 1 third_party/i2pd
          sudo apt-get update -qq
          sudo apt-get install -y -qq libboost-dev libboost-program-options-dev libssl-dev zlib1g-dev
      - name: current reseed certificates (upstream i2pd now, not the pin)
        run: scripts/fresh-i2p-certs.sh "$RUNNER_TEMP/i2p-certs"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # only main writes it — see .github/workflows/README.md
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: fetch the network database snapshot
        uses: actions/download-artifact@v8
        with:
          name: netdb-seed
          path: seed
      - name: build gipny-agent
        run: |
          export I2P_EMBED_STATIC_LIBS=boost_program_options
          export I2P_EMBED_LIB_DIRS="/usr/lib/$(gcc -dumpmachine)"
          cargo build --release -p gipny-agent --features embedded-i2p
      - name: package
        run: |
          VERSION="$(jq -r .version core/tauri.conf.json)"
          name="gipny-agent_${VERSION}_linux-${{ matrix.arch }}"
          mkdir -p "dist/$name"
          install -m 0755 target/release/gipny-agent "dist/$name/"
          install -m 0644 seed/i2pd-netdb-seed.tar.gz "dist/$name/"
          install -m 0644 agent/gipny-agent.service "dist/$name/"
          cat > "dist/$name/README.txt" << 'EOF'
          gipny-agent — headless console agent for gipny-i2p

          What is in this archive:
            gipny-agent             the agent, with the i2p router built in (no ports)
            i2pd-netdb-seed.tar.gz  known i2p routers for a quick first start (keep it next to gipny-agent)
            gipny-agent.service   systemd unit

          The agent hosts a personal relay for itself at every start, the same
          way the desktop app does for its own inbox — no relay to set up.
          It needs a minute or two to come up before the agent prints its own
          card. --relay is only for pointing the agent at an external relay
          instead (the gipny-relay archive from the same release page), for
          anyone who wants mail held while the agent is stopped.

          Run by hand:
            ./gipny-agent --data <dir> --master <gipny:v2:... card of the master>
          --master is needed once: it is kept in <dir>/master.card and later
          runs read it from there (pass it again to change it). Same for the
          optional --relay, in <dir>/relay.txt.
          Copy the master's card right before the first start: with the
          built-in relay the address in it is good until the master's app is
          restarted. After the first contact the agent follows the master's
          address by itself.
          --data can also come from the GIPNY_AGENT_DATA environment variable.

          Install as a service (Linux, as root):
            install -m 0755 gipny-agent /usr/local/bin/
            install -m 0644 i2pd-netdb-seed.tar.gz /usr/local/bin/
            install -m 0644 gipny-agent.service /etc/systemd/system/
            mkdir -p /var/lib/gipny-agent
            printf 'GIPNY_AGENT_ARGS=--master %s\n' 'gipny:v2:...' > /etc/gipny-agent.env
            chmod 0600 /etc/gipny-agent.env
            systemctl daemon-reload && systemctl enable --now gipny-agent
            journalctl -u gipny-agent -f      # prints "agent card: ..." once the router is up

          The master's app gains a contact for this agent by itself; the
          chat with it has a chat/console switch. Switching the agent off
          from the master's side stops the process (exit 0); with
          Restart=on-failure the service then stays down until started again.

          Options:
            --name <name>      display name for this agent (default: hostname)
            --relay <dest>     external relay to collect from instead of the agent's own
                               built-in one
            --cwd <dir>        working directory for commands (default: home directory)
            --timeout <secs>   per-command timeout (default: 120)
          EOF
          # Must run on the architecture this tarball is named for.
          file "dist/$name/gipny-agent"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ls -lh dist/*.tar.gz
      # A clean host has no i2pd, and the agent needs none: the router is
      # built in. Unpack the tarball somewhere fresh, make sure no i2pd is on
      # PATH, start the agent with a syntactically valid throwaway master card
      # and wait for it to print its own card — which it only does once its
      # router runs *and* its own built-in relay has tunnels.
      - name: smoke test — the tarball starts with no i2pd anywhere
        run: |
          if command -v i2pd >/dev/null; then echo "an i2pd on PATH would mask this test"; exit 1; fi
          smoke="$(mktemp -d)"
          tar -C "$smoke" -xzf dist/*.tar.gz
          cd "$smoke"/gipny-agent_*/
          zeros="$(printf '0%.0s' $(seq 1 64))"
          b32="$(printf 'a%.0s' $(seq 1 52)).b32.i2p"
          setsid ./gipny-agent --data "$smoke/data" --master "gipny:v2:$b32:$zeros:$zeros:$b32" > "$smoke/agent.log" 2>&1 &
          pid=$!
          for i in $(seq 1 240); do
            grep -q "agent card:" "$smoke/agent.log" && break
            kill -0 "$pid" 2>/dev/null || break
            sleep 2
          done
          kill -TERM -- -"$pid" 2>/dev/null || true; sleep 2; kill -KILL -- -"$pid" 2>/dev/null || true
          if grep -q "agent card:" "$smoke/agent.log"; then
            echo "smoke: the agent ran its built-in router and printed its card"
            grep -E "i2p address|agent card" "$smoke/agent.log"
          else
            echo "smoke: the agent did not come up from the tarball"; cat "$smoke/agent.log"
            echo "--- router log:"; tail -40 "$smoke"/data/i2p/router/i2pd.log 2>/dev/null || echo "(no router log)"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: gipny-agent-linux-${{ matrix.arch }}
          retention-days: 5
          path: dist/*.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2d. Android router: i2pd built as the JNI library GipnyService loads, for
  #     64- and 32-bit ARM. Cached on the i2pd pin + NDK + boost revision,
  #     because a cold build is ~1h (boost and OpenSSL from source) and the pin
  #     rarely moves.
  # ---------------------------------------------------------------------------
  android-router:
    name: router (i2pd, android ${{ matrix.abi }})
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # arch is what i2pd-android's build_boost.sh/build_openssl.sh call it.
          - { abi: arm64-v8a, arch: arm64 }
          - { abi: armeabi-v7a, arch: arm }
    env:
      NDK_VERSION: 27.3.13750724
      # Pinned; see i2pd-build.yml. Must match it, or the release ships an
      # Android router built from different sources than the one that was tested.
      BOOST_FOR_ANDROID_REV: 7943955c4d11a5bd61381a8b200c28619323eb0f
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: check out the pinned vendored sources
        id: pins
        run: |
          git submodule update --init --recursive
          echo "I2PD_REV=$(git -C third_party/i2pd rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "i2pd_android=$(git -C third_party/i2pd-android rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: restore cached router
        id: cache
        uses: actions/cache@v6
        with:
          path: staged/libi2pd.so
          # The jni tree is in the key: changing a compiler flag there must not
          # restore a library built without it.
          key: i2pd-android-${{ matrix.abi }}-${{ env.I2PD_REV }}-ndk${{ env.NDK_VERSION }}-boost${{ env.BOOST_FOR_ANDROID_REV }}-jni${{ hashFiles('android-router/jni/**', 'i2p-embed/shim/**') }}

      - uses: actions/setup-java@v6
        if: steps.cache.outputs.cache-hit != 'true'
        with: { distribution: temurin, java-version: '17' }
      # packages: the action's default is "tools platform-tools", and the
      # obsolete `tools` package was removed from Google's SDK repository —
      # the job dies with "Failed to find package 'tools'" before anything is
      # built. Everything this job needs is named here instead, which also keeps
      # us off `sdkmanager` directly — Google deprecated that CLI, and every run
      # said so.
      - uses: android-actions/setup-android@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with: { packages: 'platform-tools ndk;27.3.13750724' }

      - name: resolve NDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          NDK_DIR="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          test -d "$NDK_DIR" || { echo "NDK $NDK_VERSION is not installed — is it still the version in `packages:`?"; exit 1; }
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: align the vendored sources
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: third_party/i2pd-android/binary/jni
        run: |
          # Build the i2pd revision this repo pins, not the one i2pd-android
          # happens to point at, so desktop and Android ship the same code.
          # Fetch the SHA explicitly: the nested checkout is shallow and a
          # --tags fetch does not necessarily reach a commit ~200 past the tag.
          # Failing here costs an hour of boost that already ran.
          git -C i2pd fetch --quiet origin "$I2PD_REV" || git -C i2pd fetch --quiet --tags origin
          git -C i2pd checkout --quiet "$I2PD_REV"
          git -C boost fetch --depth 1 origin "$BOOST_FOR_ANDROID_REV"
          git -C boost checkout FETCH_HEAD
          # The dependency scripts hardcode API 16, dropped by NDK r26+.
          sed -i 's/\bAPI=16\b/API=21/g' build_boost.sh build_openssl.sh
          echo "[i2pd] boost at $(git -C boost rev-parse HEAD)"

      # boost and OpenSSL take most of an hour from source and change only with
      # the NDK or their own pins — not with the i2pd pin or our JNI glue, which
      # used to throw them away with the router cache every time either moved.
      - name: restore cached dependencies (boost, openssl)
        id: deps
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            third_party/i2pd-android/binary/jni/boost/build/out/${{ matrix.abi }}
            third_party/i2pd-android/binary/jni/openssl/out/${{ matrix.abi }}
          key: android-deps-${{ matrix.abi }}-ndk${{ env.NDK_VERSION }}-boost${{ env.BOOST_FOR_ANDROID_REV }}-scripts${{ steps.pins.outputs.i2pd_android }}

      - name: build dependencies (boost, openssl)
        if: steps.cache.outputs.cache-hit != 'true' && steps.deps.outputs.cache-hit != 'true'
        working-directory: third_party/i2pd-android/binary/jni
        run: |
          ./build_boost.sh ${{ matrix.arch }}
          ./build_openssl.sh ${{ matrix.arch }}
          for lib in boost openssl; do
            find "$lib" -name '*.a' | grep -q . || { echo "$lib built nothing"; exit 1; }
          done

      - name: build libi2pd.so
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          "$ANDROID_NDK_HOME/ndk-build" \
            -C android-router/jni \
            -j"$(nproc)" \
            NDK_MODULE_PATH="$GITHUB_WORKSPACE/third_party/i2pd-android/binary/jni" \
            NDK_PROJECT_PATH="$GITHUB_WORKSPACE/android-router" \
            APP_ABI=${{ matrix.abi }} \
            APP_PLATFORM=android-24

          LIB="android-router/libs/${{ matrix.abi }}/libi2pd.so"
          NM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          # The shim the Rust side links against, and the network callback.
          for sym in gipny_router_init gipny_router_start gipny_dest_create \
                     gipny_dest_connect gipny_stream_recv gipny_stream_send \
                     Java_app_gipny_GipnyService_nativeNetworkChanged; do
            # --dynamic: ndk-build strips the copy it installs into libs/, and
            # the dynamic table is what the JVM resolves against anyway.
            "$NM" --dynamic --defined-only "$LIB" | grep -q "$sym" \
              || { echo "libi2pd.so does not export $sym"; exit 1; }
          done
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
            --strip-unneeded "$LIB"
          mkdir -p staged && cp "$LIB" staged/libi2pd.so
          ls -lh staged/libi2pd.so

      - uses: actions/upload-artifact@v7
        with:
          name: router-android-${{ matrix.abi }}
          retention-days: 5
          path: staged/libi2pd.so
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3. Android. Builds the APK with i2pd embedded in-process via JNI: the
  #    android-router job produces libi2pd.so (i2pd plus gipny's two JNI entry
  #    points), the `stageI2pdJniLibs` Gradle task drops it into jniLibs, and
  #    GipnyService.kt loads and starts it on service start.
  # ---------------------------------------------------------------------------
  # One job per ABI. Together they were the longest thing in the release
  # (~15 minutes), and they share nothing: two ABIs, two toolchains, two APKs.
  android:
    name: android (${{ matrix.abi }})
    needs: [android-router, netdb-seed]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # flavor: what tauri calls it. abi: what the APK carries.
          # suffix: what the file on the release page is called.
          - { abi: arm64-v8a, flavor: arm64, target: aarch64, rust: aarch64-linux-android, suffix: arm64 }
          - { abi: armeabi-v7a, flavor: arm, target: armv7, rust: armv7-linux-androideabi, suffix: armv7 }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: stage the embedded router
        uses: actions/download-artifact@v8
        with:
          name: router-android-${{ matrix.abi }}
          path: android-router/prebuilt/${{ matrix.abi }}
      # Compiled into the Rust side (libcore's build.rs): the app lays it out
      # into an empty netDb itself, with no file for it in the APK.
      - name: stage the network database snapshot
        uses: actions/download-artifact@v8
        with:
          name: netdb-seed
          path: android-router/netdb-seed-archive
      # The Rust side links the libi2pd.so above (router and shim) instead of
      # compiling the router, and compiles in the snapshot and the current
      # reseed certificates.
      - name: point the Rust build at the router, snapshot and certificates
        run: |
          echo "I2P_EMBED_PREBUILT_DIR=$GITHUB_WORKSPACE/android-router/prebuilt/${{ matrix.abi }}" >> "$GITHUB_ENV"
          echo "GIPNY_NETDB_SEED=$GITHUB_WORKSPACE/android-router/netdb-seed-archive/i2pd-netdb-seed.tar.gz" >> "$GITHUB_ENV"
      - name: current reseed certificates (upstream i2pd now, not the pin)
        run: scripts/fresh-i2p-certs.sh "$RUNNER_TEMP/i2p-certs"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }
      # packages: the action's default is "tools platform-tools", and the
      # obsolete `tools` package was removed from Google's SDK repository —
      # the job dies with "Failed to find package 'tools'" before anything is
      # built. Everything this job needs is named here instead, which also keeps
      # us off `sdkmanager` directly — Google deprecated that CLI, and every run
      # said so.
      - uses: android-actions/setup-android@v4
        with: { packages: 'platform-tools ndk;27.3.13750724' }
      - name: point at the NDK and shim the binutils names
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"
          # openssl-src's Android build expects binutils-style `<triple>-ranlib`/
          # `<triple>-ar`; NDK r23+ ships only the llvm-* names. Shim them.
          # 32-bit ARM goes by two prefixes: arm-linux-androideabi for binutils
          # and armv7a-linux-androideabi for the clang wrappers.
          tc="$ANDROID_SDK_ROOT/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for triple in aarch64-linux-android arm-linux-androideabi armv7a-linux-androideabi; do
            ln -sf "$tc/llvm-ranlib" "$tc/$triple-ranlib"
            ln -sf "$tc/llvm-ar" "$tc/$triple-ar"
          done
          echo "$tc" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v7
        with: { node-version: '20', cache: npm, cache-dependency-path: ui/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-linux-android,armv7-linux-androideabi' }
      # The Rust side of the APK is the same workspace the desktop builds, and
      # it was recompiled from zero every release.
      - uses: Swatinem/rust-cache@v2
        with:
          # only main writes it — see .github/workflows/README.md
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: android-${{ matrix.abi }}
      # Gradle downloads its own world; without this it does so every time.
      - name: cache gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('core/gen/android/**/*.gradle*', 'core/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      # `cargo install tauri-cli` compiles it from source — minutes, every run.
      # cargo-binstall fetches the release binary and falls back to building.
      - uses: cargo-bins/cargo-binstall@main
      - name: install tauri-cli
        run: cargo binstall -y --locked tauri-cli@^2 || cargo install tauri-cli --version '^2' --locked
      - name: build frontend
        run: cd ui && npm ci && npm run build
      - name: configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gipny-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/gipny-release.jks" >> "$GITHUB_ENV"
      - name: tauri android build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Only this job's ABI: Gradle otherwise asks for x86_64 too and fails
          # by design (no prebuilt library here), and staging the other ABI
          # would be work this job's APK throws away.
          ORG_GRADLE_PROJECT_routerAbis: ${{ matrix.abi }}
        # --split-per-abi: one APK per ABI, so a 64-bit phone does not download
        # the 32-bit libraries it will never load. It also keeps each APK to
        # its own ABI: Tauri's per-arch flavors filter jniLibs, while the
        # universal flavor would pack every ABI staged in jniLibs.
        run: cd core && cargo tauri android build --apk --split-per-abi --target ${{ matrix.target }} --features embedded-i2p
      - name: verify signed APKs
        run: |
          # apksigner is not on PATH — pick the newest build-tools copy.
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$APKSIGNER"
          VERSION="$(jq -r .version core/tauri.conf.json)"
          out=core/gen/android/app/build/outputs/apk
          mkdir -p dist
          # <flavor> <abi in the APK> <name users see>
          for spec in "${{ matrix.flavor }} ${{ matrix.abi }} ${{ matrix.suffix }}"; do
            set -- $spec
            apk="$(find "$out/$1" -type f -name '*.apk' -print -quit)"
            test -n "$apk" || { echo "no APK for $2"; exit 1; }
            "$APKSIGNER" verify --verbose "$apk"
            # The router has to actually be in there. A release APK without
            # libi2pd.so installs, starts, and never connects — the exact
            # failure the i2pd migration exists to end, and one nothing
            # downstream would catch.
            unzip -l "$apk" | grep -F "lib/$2/libi2pd.so"
            unzip -l "$apk" | grep -F "lib/$2/libgipny_lib.so"
            # The app must run the router it carries, not look for SAM: the
            # Rust library links libi2pd.so.
            unzip -p "$apk" "lib/$2/libgipny_lib.so" > "$RUNNER_TEMP/libgipny_lib.so"
            "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -d "$RUNNER_TEMP/libgipny_lib.so" \
              | grep -F '[libi2pd.so]' || { echo "libgipny_lib.so does not link libi2pd.so"; exit 1; }
            # Exactly one ABI. A stray second one makes Android pick it as the
            # primary on a device that supports both, and load a directory
            # where libgipny_lib.so may not exist.
            abis="$(unzip -Z1 "$apk" | sed -n 's#^lib/\([^/]*\)/.*#\1#p' | sort -u)"
            test "$abis" = "$2" || { echo "$apk carries ABIs: $abis (want only $2)"; exit 1; }
            cp "$apk" "dist/gipny-i2p_${VERSION}_android-$3.apk"
          done
          ls -lh dist
      - uses: actions/upload-artifact@v7
        with:
          name: gipny-android-${{ matrix.suffix }}
          retention-days: 5
          path: dist/*.apk
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 4. The release page. On a tag it publishes; on a manual run it builds the
  #    same page and checksums and stops there, so the page can be read before
  #    anything goes public. .github/scripts/release-notes.sh refuses to write
  #    notes if any platform's file is missing or an unexpected file is present.
  # ---------------------------------------------------------------------------
  publish:
    name: release page
    needs: [version, desktop, relay, agent, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release + upload assets
    steps:
      - uses: actions/checkout@v7
        with:
          # The changelog runs from the previous tag, which needs history.
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with: { pattern: gipny-*, path: artifacts }
      - name: collect assets and checksums
        run: |
          mkdir -p dist
          # Artifacts keep the bundler's directory layout; the release is flat,
          # so two files with one name would silently become one.
          find artifacts -type f -print0 | while IFS= read -r -d '' f; do
            name="$(basename "$f")"
            [ ! -e "dist/$name" ] || { echo "two assets named $name"; exit 1; }
            cp "$f" "dist/$name"
          done
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
          ls -lh dist
      - name: write the release page
        run: |
          TAG="v${{ needs.version.outputs.version }}"; REF=HEAD
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          .github/scripts/release-notes.sh "$TAG" dist "$GITHUB_REPOSITORY" "$REF" > notes.md
          {
            echo "# Release page preview: gipny-i2p $TAG"
            echo
            cat notes.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: keep the preview
        if: needs.version.outputs.publish != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-page-preview
          retention-days: 5
          path: |
            notes.md
            dist/SHA256SUMS.txt
      # gh rather than softprops/action-gh-release: in 0.4.4 its upload of one
      # 11 MB asset hung until "Headers Timeout Error" on two attempts in a row,
      # and a rerun cannot get past an asset stuck half-uploaded under the same
      # name. Here every file gets a time limit, retries, and --clobber, which
      # replaces whatever a previous attempt left. The release stays a draft
      # until every asset is in, so clients never see a half-published one.
      # The tag does not exist yet: GitHub makes it on the commit that was
      # built (--target) when the draft is published at the end. A tag made
      # by this workflow's token starts no other run.
      - name: publish
        if: needs.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --draft --title "gipny-i2p $TAG" --notes-file notes.md
          fi
          for f in dist/*; do
            ok=
            for attempt in 1 2 3 4 5; do
              if timeout 300 gh release upload "$TAG" "$f" --clobber; then ok=1; break; fi
              echo "upload of $f failed (attempt $attempt), retrying"
              sleep $((attempt * 15))
            done
            [ -n "$ok" ] || { echo "could not upload $f"; exit 1; }
          done
          # v1.2.3-rc1 and the like are pre-releases and never "Latest".
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false --title "gipny-i2p $TAG" --notes-file notes.md
          else
            gh release edit "$TAG" --draft=false --latest --title "gipny-i2p $TAG" --notes-file notes.md
          fi
