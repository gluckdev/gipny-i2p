name: relay-testnet

# TEMPORARY test relay hosted on a GitHub-hosted runner while no real server
# exists. One run keeps the relay up for ~5.7h (the job hard limit is 6h); the
# schedule launches the next run, and actions/cache carries the relay identity,
# message queue and i2p router state across runs — so the relay's i2p
# destination stays STABLE. Expect a few minutes of downtime around each
# handover (plus tunnel rebuild).
#
# The relay runs with `--dht`: it is also the seed of the relay network, the
# node every client finds first (its destination goes into the repository
# variable GIPNY_DHT_SEEDS, which release.yml bakes into builds).
#
# The state (relay identity, DHT items and peers, router) crosses runs through
# actions/cache ENCRYPTED with age. Caches are readable from PR workflows; a
# plaintext dest.key there would let anyone impersonate the seed. The key is
# the secret DHT_SEED_AGE_KEY (an `age-keygen` identity; the recipient is
# derived from it). Without the secret the relay still serves, but nothing is
# saved and the next run comes up under a new destination.
#
# Caveats, deliberately accepted: a crashed run may lose the tail since the
# last save; the seed is away for a few minutes around each handover.
# Kill switch: disable the workflow in the Actions UI.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read

# Never two relays with the same identity at once (LeaseSet conflict): a new
# run queues until the previous one dies.
concurrency:
  group: relay-testnet
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/relay
      # A new cache name on purpose: the old relay-testnet-state-* caches held
      # the identity in the clear, so the seed starts from a key never exposed.
      - name: restore sealed state
        uses: actions/cache/restore@v6
        with:
          path: relay-state.tar.gz.age
          key: dht-seed-state-${{ github.run_id }}
          restore-keys: dht-seed-state-
      - name: unseal state
        env:
          AGE_KEY: ${{ secrets.DHT_SEED_AGE_KEY }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq age
          mkdir -p relay-state
          if [ -z "$AGE_KEY" ]; then
            echo "::warning::DHT_SEED_AGE_KEY is not set: state will not be saved, the destination changes every run"
            exit 0
          fi
          umask 077
          printf '%s\n' "$AGE_KEY" > "$RUNNER_TEMP/age.key"
          if [ -s relay-state.tar.gz.age ]; then
            age -d -i "$RUNNER_TEMP/age.key" relay-state.tar.gz.age | tar -xz -C relay-state
            rm relay-state.tar.gz.age
            echo "state restored"
          else
            echo "no saved state: first run, a new destination"
          fi
      # Build the router from the pinned submodule, not from apt. The distro
      # binary aborted on startup — boost::filesystem::create_directory
      # "Permission denied" on its own datadir under the runner workspace — and
      # it is the wrong binary anyway: this relay should exercise the router the
      # release ships, from the same pin. A few minutes of build against a 5.5h
      # serve window is a fair trade.
      - name: build router + relay
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libboost-all-dev libssl-dev zlib1g-dev
          git submodule update --init --recursive -- third_party/i2pd
          git -C third_party/i2pd fetch --quiet --unshallow --tags origin || \
            git -C third_party/i2pd fetch --quiet --tags origin
          make -C third_party/i2pd USE_UPNP=no TORRENTS=no USE_GIT_VERSION=yes -j"$(nproc)"
          ./third_party/i2pd/i2pd --version
          cargo build --release --manifest-path core/relay/Cargo.toml
      # Split into start/serve/stop steps so the destination lands in the job
      # summary minutes after start, not when the 5.5h serve step ends.
      - name: start router + relay, print destination
        run: |
          mkdir -p relay-state/router relay-state/relay
          nohup ./third_party/i2pd/i2pd \
            --datadir="$PWD/relay-state/router" \
            --sam.enabled=true --sam.address=127.0.0.1 --sam.port=7656 \
            --http.enabled=false --httpproxy.enabled=false \
            --socksproxy.enabled=false --upnp.enabled=false \
            --log=stdout \
            > router.log 2>&1 &
          echo $! > router.pid
          # SAM up? (bash /dev/tcp probe — nc is not guaranteed on runners)
          for i in $(seq 1 180); do
            if timeout 2 bash -c 'exec 3<>/dev/tcp/127.0.0.1/7656' 2>/dev/null; then break; fi
            if ! kill -0 "$(cat router.pid)" 2>/dev/null; then
              echo "router died during startup"; tail -50 router.log; exit 1
            fi
            sleep 2
          done
          GIPNY_RELAY_DATA=relay-state/relay nohup \
            ./core/relay/target/release/gipny-relay --dht > relay.log 2>&1 &
          echo $! > relay.pid
          # dest.pub is written by the relay before the SAM session opens.
          for i in $(seq 1 120); do
            [ -s relay-state/relay/dest.pub ] && break
            if ! kill -0 "$(cat relay.pid)" 2>/dev/null; then
              echo "relay died during startup"; tail -50 relay.log; exit 1
            fi
            sleep 2
          done
          {
            echo '### relay-testnet destination'
            echo 'Paste into Settings → relay address, or into the repository variable GIPNY_DHT_SEEDS (the seed release builds carry).'
            echo '```'
            cat relay-state/relay/dest.pub 2>/dev/null || echo 'dest.pub missing — see logs'
            echo ''
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cp relay-state/relay/dest.pub dest.pub 2>/dev/null || true
      # v4+ artifacts are downloadable immediately, long before the job ends.
      - name: publish destination artifact
        uses: actions/upload-artifact@v7
        with:
          name: relay-destination
          path: dest.pub
      - name: serve (~5.5h)
        run: |
          end=$((SECONDS + 19800))
          while [ $SECONDS -lt $end ] && kill -0 "$(cat relay.pid)" 2>/dev/null; do
            sleep 60
          done
          kill -0 "$(cat relay.pid)" 2>/dev/null || { echo "relay exited early"; tail -30 relay.log; }
      - name: stop and flush
        if: always()
        run: |
          kill "$(cat relay.pid)" 2>/dev/null || true
          sleep 3
          kill "$(cat router.pid)" 2>/dev/null || true
          # The state is packed next: wait for the router to let go of it.
          for i in $(seq 1 30); do kill -0 "$(cat router.pid)" 2>/dev/null || break; sleep 1; done
          tail -20 relay.log || true
      # After both processes are gone, so the SQLite files (with their WAL)
      # are consistent on disk.
      - name: seal state
        id: seal
        if: always()
        run: |
          [ -s "$RUNNER_TEMP/age.key" ] || { echo "no key: nothing is saved"; exit 0; }
          [ -s relay-state/relay/dest.key ] || { echo "no identity to save"; exit 0; }
          recipient=$(age-keygen -y "$RUNNER_TEMP/age.key")
          tar -cz -C relay-state . | age -r "$recipient" -o relay-state.tar.gz.age
          rm -f "$RUNNER_TEMP/age.key"
          ls -l relay-state.tar.gz.age
          echo "sealed=true" >> "$GITHUB_OUTPUT"
      - name: save sealed state
        if: always() && steps.seal.outputs.sealed == 'true'
        uses: actions/cache/save@v6
        with:
          path: relay-state.tar.gz.age
          key: dht-seed-state-${{ github.run_id }}
