name: e2e-i2pd

# End-to-end messaging test: relays + two headless bot clients, latency report.
#
# This is the only job in the repo that answers the question the product turns
# on: do messages arrive over live i2p. It proves the full
# "boot → link → deliver → measure" path end to end.
#
# Every binary here compiles the i2p router in (i2p-embed): the relays, the
# harness (both bots on one router, a destination each) and the agent each run
# their own, in their own process. There is no i2pd beside them, no SAM and no
# local port — the way the app ships.
#
# The router under test is upstream's branch head, not the pin: every job
# compiles that revision in, and when the relay job delivers, `bump` moves the
# pin to it. That is how the pin earns its way forward — by delivering, not by
# compiling.
#
# Runs nightly + on demand rather than on every push/PR.
#
# It is NOT continue-on-error. It was, on the argument that reseed and tunnel
# building are flaky — but that made a green check meaningless, and meaningless
# green is how a transport that delivered zero messages stayed hidden for weeks
# (#42). A failed delivery reds the job.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  # Any change to the vendored router — dependabot's weekly submodule bump, or
  # ours — has to prove it still delivers before it can be merged. Compiling is
  # not the bar; carrying messages over live i2p is.
  pull_request:
    paths:
      - 'third_party/**'
      - '.github/workflows/e2e-i2pd.yml'
      - '.github/scripts/i2pd-under-test.sh'

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # Which revision is under test: the tracked branch's head, resolved once so
  # every job below compiles the same one even if upstream pushes meanwhile.
  # ------------------------------------------------------------------
  head:
    name: i2pd revision under test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      revision: ${{ steps.head.outputs.revision }}
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: resolve the upstream head
        id: head
        run: |
          # Unshallow for `git describe`: actions/checkout clones shallow with
          # no tags, and describe dies with "No tags can describe <sha>".
          git submodule update --init -- third_party/i2pd
          PINNED="$(git -C third_party/i2pd rev-parse --short HEAD)"
          git -C third_party/i2pd fetch --quiet --unshallow --tags origin || \
            git -C third_party/i2pd fetch --quiet --tags origin
          # Fetch the tracked branch by name: `git submodule update --remote`
          # cannot, as checkout pins the submodule's refspec to a single SHA.
          BRANCH="$(git config -f .gitmodules submodule.third_party/i2pd.branch)"
          git -C third_party/i2pd fetch --quiet origin "$BRANCH"
          git -C third_party/i2pd checkout --quiet FETCH_HEAD
          SHA="$(git -C third_party/i2pd rev-parse HEAD)"
          REV="$(git -C third_party/i2pd describe --tags)"
          echo "branch:     $BRANCH"
          echo "pinned:     $PINNED"
          echo "under test: $REV  $(git -C third_party/i2pd log --oneline -1 | cut -d' ' -f2-)"
          if [ "$PINNED" = "${SHA:0:${#PINNED}}" ]; then
            echo "note: branch head equals the pin — this run re-proves the pinned router"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "revision=$REV" >> "$GITHUB_OUTPUT"

  e2e:
    name: e2e (relay + two bots)
    needs: head
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      delivered: ${{ steps.harness.outputs.delivered }}
    steps:
      - uses: actions/checkout@v7
      - name: i2pd under test and its build deps
        run: .github/scripts/i2pd-under-test.sh "${{ needs.head.outputs.sha }}"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Cache the relay sub-workspace and the harness separately from the
          # main workspace so the large Tauri/gstreamer deps don't bloat this job.
          workspaces: |
            core/relay
            . -> target
          # only main writes it — see .github/workflows/README.md
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: build relay and e2e harness
        run: |
          cargo build --release --manifest-path core/relay/Cargo.toml
          cargo build --release -p e2e-harness

      - name: start two relays, capture destinations
        run: |
          # Two relays, one per bot, each a process with its own router. This
          # is what makes the run prove something: each bot collects from its
          # own, so a message only arrives if the sender deposited on the
          # *recipient's* relay.
          start_relay() {
            name="$1"
            mkdir -p "e2e-state/$name"
            GIPNY_RELAY_DATA="e2e-state/$name" \
            nohup ./core/relay/target/release/gipny-relay \
              > "e2e-logs/$name.log" 2>&1 &
            echo $! > "$name.pid"
            echo "[e2e-setup] $name pid=$(cat "$name.pid")"
            # dest.pub is written before the destination is up.
            for i in $(seq 1 120); do
              [ -s "e2e-state/$name/dest.pub" ] && break
              if ! kill -0 "$(cat "$name.pid")" 2>/dev/null; then
                echo "$name died during startup"; tail -50 "e2e-logs/$name.log"; exit 1
              fi
              sleep 2
            done
            if [ ! -s "e2e-state/$name/dest.pub" ]; then
              echo "$name: dest.pub never appeared"; tail -50 "e2e-logs/$name.log"; exit 1
            fi
          }
          export GIPNY_I2P_LOGLEVEL=info
          start_relay relay-a
          start_relay relay-b
          # Alive a few seconds on: dest.pub alone proves only that keys exist.
          sleep 5
          for r in relay-a relay-b; do
            kill -0 "$(cat "$r.pid")" 2>/dev/null || { echo "$r died after dest.pub"; tail -50 "e2e-logs/$r.log"; exit 1; }
          done
          {
            echo "RELAY_DEST_A=$(cat e2e-state/relay-a/dest.pub)"
            echo "RELAY_DEST_B=$(cat e2e-state/relay-b/dest.pub)"
          } >> "$GITHUB_ENV"

      - name: run e2e harness
        id: harness
        env:
          E2E_RELAY_DEST: ${{ env.RELAY_DEST_A }}
          E2E_RELAY_DEST_A: ${{ env.RELAY_DEST_A }}
          E2E_RELAY_DEST_B: ${{ env.RELAY_DEST_B }}
          E2E_N_MESSAGES: '5'
          E2E_TIMEOUT_SECS: '900'
          E2E_WORK_DIR: e2e-state
          # A file in parts through server relays: bot-b collects them over
          # several connections to its relay at once.
          E2E_BIG_FILE: '10485760'
          # The routers' own logs, uploaded below, for where a letter waits.
          GIPNY_I2P_LOGLEVEL: info
        run: |
          # `|| TIME_RC=$?` keeps the failure as data: the log is printed and
          # `delivered` is set either way.
          TIME_RC=0
          if command -v /usr/bin/time >/dev/null 2>&1; then
            /usr/bin/time -v ./target/release/e2e-harness \
              > e2e-logs/harness.log 2>&1 || TIME_RC=$?
          else
            ./target/release/e2e-harness > e2e-logs/harness.log 2>&1 || TIME_RC=$?
          fi
          cat e2e-logs/harness.log
          # Delivery, not exit status, is the question this job exists to
          # answer, and it gates the pin bump below.
          if [ "$TIME_RC" -eq 0 ] && grep -q '\[e2e\] SUCCESS' e2e-logs/harness.log; then
            echo "delivered=true" >> "$GITHUB_OUTPUT"
          else
            echo "delivered=false" >> "$GITHUB_OUTPUT"
          fi
          exit $TIME_RC

      - name: timing summary
        if: always()
        run: |
          {
            echo '### e2e messaging test'
            echo ''
            if grep -q '\[e2e-timing\]' e2e-logs/harness.log 2>/dev/null; then
              grep -A 20 '\[e2e-timing\]' e2e-logs/harness.log | tail -20
            else
              echo '_harness log not available or timing block missing_'
            fi
            echo ''
            grep -aE 'big file:|window to contact|another connection to our relay' e2e-logs/harness.log 2>/dev/null | head -8 || true
            echo ''
            if grep -q 'Maximum resident' e2e-logs/harness.log 2>/dev/null; then
              echo '**Peak RSS (harness process):**'
              echo '```'
              grep 'Maximum resident' e2e-logs/harness.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: stop relays
        if: always()
        run: |
          kill "$(cat relay-a.pid)" 2>/dev/null || true
          kill "$(cat relay-b.pid)" 2>/dev/null || true
          for r in relay-a relay-b; do
            echo "--- $r log (last 30 lines) ---"
            tail -30 "e2e-logs/$r.log" || true
          done

      # Always: a green run can still be slow, and the router's log is where
      # the time went.
      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: |
            e2e-logs/
            e2e-state/**/i2pd.log
          retention-days: 7

  # ------------------------------------------------------------------
  # The same delivery test with no standalone relay: each bot's relay is an
  # EphemeralRelay running inside the harness process. Proves libcore's relay
  # server works over live i2p, not just over the in-memory pipe its unit
  # tests use. Not in bump's needs: it tests our relay code, so its failure
  # must not hold back a router revision the relay job proved.
  # ------------------------------------------------------------------
  e2e-in-process:
    name: e2e (relays inside the bots)
    needs: head
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: i2pd under test and its build deps
        run: .github/scripts/i2pd-under-test.sh "${{ needs.head.outputs.sha }}"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: build e2e harness
        run: cargo build --release -p e2e-harness
      - name: run e2e harness
        env:
          E2E_IN_PROCESS_RELAYS: '1'
          E2E_N_MESSAGES: '5'
          E2E_TIMEOUT_SECS: '900'
          E2E_WORK_DIR: e2e-state
        run: |
          set -o pipefail
          ./target/release/e2e-harness 2>&1 | tee e2e-logs/harness.log
      # Always: a green run can still be slow, and the router's log is where
      # the time went.
      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-in-process-logs
          path: |
            e2e-logs/
            e2e-state/**/i2pd.log
          retention-days: 7

  # ------------------------------------------------------------------
  # Delivery through the relay network while each side is away in turn: B
  # leaves, A writes; A leaves, B comes back on a new address, reads and
  # answers; B leaves, A comes back elsewhere and reads the answers. The seed
  # is a `gipny-relay --dht` started here, so the run needs neither the
  # long-running relay-testnet seed nor its age key. Not in bump's needs: it
  # tests our code, not the router.
  # ------------------------------------------------------------------
  e2e-dht:
    name: e2e (relay network, each side away in turn)
    needs: head
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: i2pd under test and its build deps
        run: .github/scripts/i2pd-under-test.sh "${{ needs.head.outputs.sha }}"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core/relay
            . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: build seed and e2e harness
        run: |
          cargo build --release --manifest-path core/relay/Cargo.toml
          cargo build --release -p e2e-harness
      - name: start the seed, capture its destination
        run: |
          mkdir -p e2e-state/seed
          GIPNY_RELAY_DATA=e2e-state/seed nohup \
            ./core/relay/target/release/gipny-relay --dht > e2e-logs/seed.log 2>&1 &
          echo $! > seed.pid
          for i in $(seq 1 120); do
            [ -s e2e-state/seed/dest.pub ] && break
            if ! kill -0 "$(cat seed.pid)" 2>/dev/null; then
              echo "seed died during startup"; tail -50 e2e-logs/seed.log; exit 1
            fi
            sleep 2
          done
          [ -s e2e-state/seed/dest.pub ] || { echo "seed: dest.pub never appeared"; tail -50 e2e-logs/seed.log; exit 1; }
          sleep 5
          kill -0 "$(cat seed.pid)" 2>/dev/null || { echo "seed died after dest.pub"; tail -50 e2e-logs/seed.log; exit 1; }
          echo "E2E_DHT_SEED_DEST=$(cat e2e-state/seed/dest.pub)" >> "$GITHUB_ENV"
      - name: run e2e harness
        env:
          E2E_DHT_OFFLINE: '1'
          E2E_N_MESSAGES: '3'
          E2E_TIMEOUT_SECS: '2400'
          E2E_WORK_DIR: e2e-state
        run: |
          set -o pipefail
          ./target/release/e2e-harness 2>&1 | tee e2e-logs/harness.log
      - name: seed log
        if: always()
        run: tail -100 e2e-logs/seed.log || true
      - name: stop seed
        if: always()
        run: kill "$(cat seed.pid)" 2>/dev/null || true
      # Always: a green run can still be slow, and the router's log is where
      # the time went.
      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-dht-logs
          path: |
            e2e-logs/
            e2e-state/**/i2pd.log
          retention-days: 7

  # ------------------------------------------------------------------
  # The real gipny-agent binary as the far side. bot-a is the master; the agent
  # is a separate process with its own router, started with bot-a's v2 card the
  # way a server would be. Proves over live i2p: the agent's first message
  # creates the contact on the master and carries GRANT; commands run one at a
  # time in arrival order; a file sent with a command is saved before it runs;
  # OFF is answered with REVOKE and exit 0. Not in bump's needs: it tests our
  # agent code, not the router.
  # ------------------------------------------------------------------
  e2e-agent:
    name: e2e (agent binary)
    needs: head
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: i2pd under test and its build deps
        run: .github/scripts/i2pd-under-test.sh "${{ needs.head.outputs.sha }}"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: build e2e harness and gipny-agent
        run: cargo build --release -p e2e-harness -p gipny-agent
      - name: run e2e harness against the agent binary
        env:
          E2E_AGENT_BIN: ./target/release/gipny-agent
          E2E_IN_PROCESS_RELAYS: '1'
          E2E_N_MESSAGES: '5'
          E2E_TIMEOUT_SECS: '900'
          E2E_WORK_DIR: e2e-state
        run: |
          set -o pipefail
          ./target/release/e2e-harness 2>&1 | tee e2e-logs/harness.log
      # Always: a green run can still be slow, and the router's log is where
      # the time went.
      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-agent-logs
          path: |
            e2e-logs/
            e2e-state/**/i2pd.log
          retention-days: 7

  # ------------------------------------------------------------------
  # Record the revision that actually delivered.
  #
  # The submodule follows upstream's branch, so a build alone proves only that
  # the code compiles. This moves the pin in the repository to the revision
  # that just carried five messages over live i2p, giving us a "last known
  # good router" rather than "whatever upstream had that night".
  #
  # It only ever moves the pin forward on success. A failed run leaves the
  # previous proven revision in place: e2e is network-bound and genuinely
  # flaky, so one bad night says nothing about the revision and must not
  # revert anything.
  # ------------------------------------------------------------------
  bump:
    name: record the proven revision
    needs: [head, e2e]
    if: >-
      github.repository == 'gluckdev/gipny-i2p' &&
      github.event_name != 'pull_request' &&
      needs.e2e.outputs.delivered == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ github.ref_name }}

      - name: move the pin to the proven revision
        env:
          PROVEN_SHA: ${{ needs.head.outputs.sha }}
          PROVEN_REV: ${{ needs.head.outputs.revision }}
        run: |
          git -C third_party/i2pd fetch --quiet origin
          git -C third_party/i2pd checkout --quiet "$PROVEN_SHA"
          git add third_party/i2pd

          if git diff --cached --quiet; then
            echo "pin is already at $PROVEN_REV — nothing to record"
            exit 0
          fi

          git -c user.name=gluckdev -c user.email=dep_it@spbsot.kz commit -m \
            "build(i2pd): pin the revision that delivered end to end

          $PROVEN_REV ($PROVEN_SHA) built and carried five messages over live
          i2p in run ${{ github.run_id }}. Recorded automatically so the
          repository holds a router proven to deliver rather than whatever
          upstream happened to have at build time."
          git push origin "HEAD:${{ github.ref_name }}"
          echo "recorded $PROVEN_REV"
