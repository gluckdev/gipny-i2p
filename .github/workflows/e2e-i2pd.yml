name: e2e-i2pd

# End-to-end messaging between headless clients with personal terminals.
#
# These jobs answer the question the product turns on: do messages arrive
# over live i2p. They prove the full
# "boot → link → deliver → measure" path end to end.
#
# Each client hosts its own terminal on its embedded I2P router.

# PR and ordinary manual checks compile the immutable router pin from the
# checked-out application commit. Nightly runs and explicit test_upstream=true
# manual probes resolve upstream once. Only an upstream probe with all four
# delivery scenarios passing may record a new pin; release checks never do.
#
# It is NOT continue-on-error. It was, on the argument that reseed and tunnel
# building are flaky — but that made a green check meaningless, and meaningless
# green is how a transport that delivered zero messages stayed hidden for weeks
# (#42). A failed delivery reds the job.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      test_upstream:
        description: 'Probe upstream instead of the committed pin; allow a bump only after all four live scenarios pass'
        type: boolean
        default: false
      throughput:
        description: 'Run only the protected throughput sweep using the committed pin; skips ordinary delivery jobs and ignores test_upstream'
        type: boolean
        default: false
      streams:
        description: 'Throughput only: sequential lane counts 1..8, at most 12 points'
        type: string
        default: '1,2,3,4,5,6,7,8'
      file_bytes:
        description: 'Throughput only: verified bytes per point, 1 MiB..128 MiB'
        type: string
        default: '33554432'
  # Any change to the vendored router — dependabot's weekly submodule bump, or
  # ours — has to prove it still delivers before it can be merged. Compiling is
  # not the bar; carrying messages over live i2p is.
  pull_request:
    paths:
      - 'third_party/**'
      - 'tests/e2e-harness/**'
      - 'libcore/src/session*'
      - 'libcore/src/session/**'
      - 'libcore/src/relay*.rs'
      - 'libcore/src/db/outbox*.rs'
      - 'libcore/src/db/outbox/**'
      - 'agent/src/**'
      - 'i2p-embed/**'
      - '.github/workflows/e2e-i2pd.yml'
      - '.github/scripts/i2pd-under-test.sh'
      - '.github/scripts/with-test-secret-service.sh'

permissions:
  contents: read

concurrency:
  group: e2e-i2pd-${{ github.head_ref || github.ref_name }}${{ github.event_name == 'workflow_dispatch' && inputs.throughput == true && '-throughput' || '' }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.throughput == true) }}

jobs:
  throughput:
    name: Explicit protected throughput sweep
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.throughput == true }}
    uses: ./.github/workflows/i2p-throughput.yml
    with:
      streams: ${{ inputs.streams }}
      file_bytes: ${{ inputs.file_bytes }}

  # ------------------------------------------------------------------
  # Resolve one immutable SHA for every job: the committed pin by default,
  # or the tracked upstream head only for schedule/explicit manual probes.
  # ------------------------------------------------------------------
  head:
    name: i2pd revision under test
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.throughput == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      revision: ${{ steps.head.outputs.revision }}
      sha: ${{ steps.head.outputs.sha }}
      pinned_sha: ${{ steps.head.outputs.pinned_sha }}
      mode: ${{ steps.head.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
      - name: resolve the committed pin or explicit upstream probe
        id: head
        env:
          EVENT_NAME: ${{ github.event_name }}
          TEST_UPSTREAM: ${{ inputs.test_upstream == true }}
        run: |
          set -euo pipefail
          PINNED="$(git rev-parse HEAD:third_party/i2pd)"
          [[ "$PINNED" =~ ^[0-9a-f]{40}$ ]] || { echo 'invalid committed i2pd pin'; exit 1; }
          git submodule update --init --recursive -- third_party/i2pd
          test "$(git -C third_party/i2pd rev-parse HEAD)" = "$PINNED"
          MODE=pinned
          if [ "$EVENT_NAME" = schedule ] || \
             { [ "$EVENT_NAME" = workflow_dispatch ] && [ "$TEST_UPSTREAM" = true ]; }; then
            MODE=upstream
            # The branch may move while the four scenarios run; resolve once.
            BRANCH="$(git config -f .gitmodules submodule.third_party/i2pd.branch)"
            git check-ref-format --branch "$BRANCH" >/dev/null
            git -C third_party/i2pd fetch --quiet --unshallow --tags origin || \
              git -C third_party/i2pd fetch --quiet --tags origin
            git -C third_party/i2pd fetch --quiet origin "$BRANCH"
            git -C third_party/i2pd checkout --quiet --detach FETCH_HEAD
          fi
          SHA="$(git -C third_party/i2pd rev-parse HEAD)"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'invalid i2pd test SHA'; exit 1; }
          if [ "$MODE" = pinned ]; then test "$SHA" = "$PINNED"; fi
          REV="$(git -C third_party/i2pd describe --tags --always)"
          echo "mode:       $MODE"
          echo "pinned:     $PINNED"
          echo "under test: $SHA ($REV)"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "pinned_sha=$PINNED" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "revision=$REV" >> "$GITHUB_OUTPUT"

  e2e:
    name: e2e (two personal terminals and a file)
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.throughput == true) }}
    needs: head
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      delivered: ${{ steps.harness.outputs.delivered }}
    steps:
      - uses: actions/checkout@v7
      - name: i2pd under test and its build deps
        run: .github/scripts/i2pd-under-test.sh "${{ needs.head.outputs.sha }}"
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: build e2e harness
        run: cargo build --locked --release -p e2e-harness

      - name: run e2e harness
        id: harness
        env:
          E2E_N_MESSAGES: '5'
          E2E_TIMEOUT_SECS: '900'
          E2E_WORK_DIR: e2e-state
          # Verify all file parts received through the personal terminal.
          E2E_BIG_FILE: '10485760'
          # The routers' own logs, uploaded below, for where a letter waits.
          GIPNY_I2P_LOGLEVEL: info
        run: |
          # `|| TIME_RC=$?` keeps the failure as data: the log is printed and
          # `delivered` is set either way.
          TIME_RC=0
          if command -v /usr/bin/time >/dev/null 2>&1; then
            /usr/bin/time -v ./target/release/e2e-harness \
              > e2e-logs/harness.log 2>&1 || TIME_RC=$?
          else
            ./target/release/e2e-harness > e2e-logs/harness.log 2>&1 || TIME_RC=$?
          fi
          cat e2e-logs/harness.log
          # Delivery, not exit status, is the question this job exists to
          # answer, and it gates the pin bump below.
          if [ "$TIME_RC" -eq 0 ] && grep -q '\[e2e\] SUCCESS' e2e-logs/harness.log; then
            echo "delivered=true" >> "$GITHUB_OUTPUT"
          else
            echo "delivered=false" >> "$GITHUB_OUTPUT"
          fi
          exit $TIME_RC

      - name: timing summary
        if: always()
        run: |
          {
            echo '### e2e messaging test'
            echo ''
            if grep -q '\[e2e-timing\]' e2e-logs/harness.log 2>/dev/null; then
              grep -A 20 '\[e2e-timing\]' e2e-logs/harness.log | tail -20
            else
              echo '_harness log not available or timing block missing_'
            fi
            echo ''
            grep -aE 'big file:|window to contact|another connection to our relay' e2e-logs/harness.log 2>/dev/null | head -8 || true
            echo ''
            if grep -q 'Maximum resident' e2e-logs/harness.log 2>/dev/null; then
              echo '**Peak RSS (harness process):**'
              echo '```'
              grep 'Maximum resident' e2e-logs/harness.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Always: a green run can still be slow, and the router's log is where
      # the time went.
      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: |
            e2e-logs/
            e2e-state/**/i2pd.log
          retention-days: 7

  # ------------------------------------------------------------------
  # Both clients send before receiving the other's first message.
  # ------------------------------------------------------------------
  e2e-both-first:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.throughput == true) }}
    name: e2e (simultaneous first messages)
    needs: head
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: i2pd under test and its build deps
        run: .github/scripts/i2pd-under-test.sh "${{ needs.head.outputs.sha }}"
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: build e2e harness
        run: cargo build --release -p e2e-harness
      - name: run e2e harness
        env:
          E2E_BOTH_FIRST: '1'
          E2E_N_MESSAGES: '5'
          E2E_TIMEOUT_SECS: '900'
          E2E_WORK_DIR: e2e-state
        run: |
          set -o pipefail
          ./target/release/e2e-harness 2>&1 | tee e2e-logs/harness.log
      # Always: a green run can still be slow, and the router's log is where
      # the time went.
      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-both-first-logs
          path: |
            e2e-logs/
            e2e-state/**/i2pd.log
          retention-days: 7

  # ------------------------------------------------------------------
  # Run the clients at disjoint times, then overlap them. A letter must
  # survive at the sender and arrive once when both terminals are available.
  # ------------------------------------------------------------------
  e2e-offline:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.throughput == true) }}
    name: e2e (offline outbox and peer return)
    needs: head
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: i2pd under test and its build deps
        run: .github/scripts/i2pd-under-test.sh "${{ needs.head.outputs.sha }}"
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: build e2e harness
        run: cargo build --locked --release -p e2e-harness
      - name: run e2e harness
        env:
          E2E_OFFLINE_RETURN: '1'
          E2E_N_MESSAGES: '3'
          E2E_TIMEOUT_SECS: '2400'
          E2E_WORK_DIR: e2e-state
        run: |
          set -o pipefail
          ./target/release/e2e-harness 2>&1 | tee e2e-logs/harness.log
      # Always: a green run can still be slow, and the router's log is where
      # the time went.
      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-offline-logs
          path: |
            e2e-logs/
            e2e-state/**/i2pd.log
          retention-days: 7

  # ------------------------------------------------------------------
  # The real gipny-agent binary as the far side. bot-a is the master; the agent
  # is a separate process with its own router, started with bot-a's v2 card the
  # way a server would be. Proves over live i2p: the agent's first message
  # creates the contact on the master and carries GRANT; commands run one at a
  # time in arrival order; a file sent with a command is saved before it runs;
  # OFF is answered with REVOKE and exit 0. This must also pass before an
  # upstream probe may record a new router pin.
  # ------------------------------------------------------------------
  e2e-agent:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.throughput == true) }}
    name: e2e (agent binary)
    needs: head
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: i2pd under test and its build deps
        run: .github/scripts/i2pd-under-test.sh "${{ needs.head.outputs.sha }}"
      - name: Native OS credential service for the encrypted agent database
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dbus-daemon gnome-keyring libsecret-tools
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: build e2e harness and gipny-agent
        run: cargo build --locked --release -p e2e-harness -p gipny-agent
      - name: Hardened-child port observer regressions
        env:
          E2E_OBSERVER_BIN: ${{ github.workspace }}/target/release/e2e-harness
        run: cargo test --locked --release -p e2e-harness
      - name: run e2e harness against the agent binary
        env:
          E2E_AGENT_BIN: ./target/release/gipny-agent
          E2E_N_MESSAGES: '5'
          E2E_TIMEOUT_SECS: '900'
          E2E_WORK_DIR: e2e-state
        run: |
          set -o pipefail
          bash .github/scripts/with-test-secret-service.sh ./target/release/e2e-harness 2>&1 | tee e2e-logs/harness.log
      # Always: a green run can still be slow, and the router's log is where
      # the time went.
      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-agent-logs
          path: |
            e2e-logs/
            e2e-state/**/i2pd.log
          retention-days: 7

  # ------------------------------------------------------------------
  # Only upstream-mode probes may record a revision, after all four live
  # scenarios pass. PR and ordinary manual shipping-pin checks never mutate it.
  # Start from the tested application commit; if the branch advanced meanwhile,
  # a normal non-forced push fails instead of assigning proof to another base.
  # ------------------------------------------------------------------
  bump:
    name: record the proven revision
    needs: [head, e2e, e2e-both-first, e2e-offline, e2e-agent]
    if: >-
      !(github.event_name == 'workflow_dispatch' && inputs.throughput == true) &&
      github.repository == 'gluckdev/gipny-i2p' &&
      github.ref_type == 'branch' &&
      needs.head.outputs.mode == 'upstream' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.test_upstream == true)) &&
      needs.e2e.result == 'success' &&
      needs['e2e-both-first'].result == 'success' &&
      needs['e2e-offline'].result == 'success' &&
      needs['e2e-agent'].result == 'success' &&
      needs.e2e.outputs.delivered == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ github.sha }}

      - name: move the pin to the proven revision
        env:
          PROVEN_SHA: ${{ needs.head.outputs.sha }}
          PROVEN_REV: ${{ needs.head.outputs.revision }}
        run: |
          git -C third_party/i2pd fetch --quiet origin
          git -C third_party/i2pd checkout --quiet "$PROVEN_SHA"
          git add third_party/i2pd

          if git diff --cached --quiet; then
            echo "pin is already at $PROVEN_REV — nothing to record"
            exit 0
          fi

          git -c user.name=gluckdev -c user.email=dep_it@spbsot.kz commit -m \
            "build(i2pd): pin the revision that delivered end to end

          $PROVEN_REV ($PROVEN_SHA) passed all four live delivery scenarios
          in upstream-mode run ${{ github.run_id }}. Recorded automatically so the
          repository holds a router proven to deliver rather than whatever
          upstream happened to have at build time."
          git push origin "HEAD:${{ github.ref_name }}"
          echo "recorded $PROVEN_REV"
