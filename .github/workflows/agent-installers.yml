name: agent installers
on:
  pull_request:
    paths: ['scripts/*agent*.ps1', 'scripts/*agent*.sh', 'scripts/verify-windows-pe.py', 'scripts/tests/**', '.github/scripts/*provenance.py', '.github/scripts/*release-guard.py', '.github/scripts/*windows*.ps1', '.github/scripts/vcpkg-i2p-deps.sh', '.github/workflows/release.yml', '.github/workflows/agent-installers.yml', '.gitattributes']
  push:
    branches: [main]
    paths: ['scripts/*agent*.ps1', 'scripts/*agent*.sh', 'scripts/verify-windows-pe.py', 'scripts/tests/**', '.github/scripts/*provenance.py', '.github/scripts/*release-guard.py', '.github/scripts/*windows*.ps1', '.github/scripts/vcpkg-i2p-deps.sh', '.github/workflows/release.yml', '.github/workflows/agent-installers.yml', '.gitattributes']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unix-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Installer shell syntax and archive integrity
        run: |
          bash -n scripts/install-agent.sh scripts/tests/agent-installer-integrity.sh
          bash scripts/tests/agent-installer-integrity.sh
          python3 .github/scripts/build-provenance.py locks
          python3 .github/scripts/test-build-provenance.py
          python3 .github/scripts/test-release-guard.py
          python3 scripts/tests/test_verify_windows_pe.py
          python3 scripts/tests/test_windows_dependencies.py
  windows-bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Exact reviewed lockfile bytes and provenance regressions on Windows
        shell: bash
        run: |
          python3 .github/scripts/build-provenance.py locks
          python3 .github/scripts/test-build-provenance.py
          python3 .github/scripts/test-release-guard.py
          python3 scripts/tests/test_verify_windows_pe.py
      - name: Checksum, interrupted staging and real Windows file replacement
        shell: powershell
        run: scripts/tests/windows-agent-update.ps1
