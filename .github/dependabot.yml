# Dependabot — flags outdated dependencies across every ecosystem in the repo.
version: 2
updates:
  # Rust: main workspace (client, libcore, bot-sdk).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # WirePayload versioning relies on bincode 1 ignoring trailing bytes, so a
      # major bump is a protocol change, not a dependency update. And 3.0.0 is a
      # tombstone release that is only a compile_error!.
      - dependency-name: bincode
        update-types: ["version-update:semver-major"]
      # For a 0.x crate the minor is the breaking step; bump jni deliberately
      # together with the port (fix/jni-0.22-port).
      - dependency-name: jni
        update-types: ["version-update:semver-minor"]
    groups:
      rust-deps:
        patterns: ["*"]

  # Rust: the relay server (separate workspace).
  - package-ecosystem: cargo
    directory: "/core/relay"
    schedule:
      interval: weekly
    ignore:
      # bincode 3.0.0 is a tombstone release that is only a compile_error!.
      - dependency-name: bincode
        versions: [">= 3"]
      # The relay crate itself uses bincode 2 and dht (a path dependency of this
      # workspace) uses bincode 1, so a semver-major bump would change the wire
      # format and cannot be automated here.
      - dependency-name: bincode
        update-types: ["version-update:semver-major"]
    groups:
      relay-deps:
        patterns: ["*"]

  # Frontend.
  - package-ecosystem: npm
    directory: "/ui"
    schedule:
      interval: weekly
    groups:
      ui-deps:
        patterns: ["*"]

  # GitHub Actions used in the CI/release workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # For this action the tag is the Rust version itself; the workflows pin
      # 1.93.1 by hand and a toolchain upgrade is an owner decision (dependabot
      # once proposed 1.120.0, which does not exist: 404 from static.rust-lang.org).
      - dependency-name: dtolnay/rust-toolchain

  # Vendored router sources (third_party/i2pd, third_party/i2pd-android).
  #
  # These track upstream branches and are bumped automatically by e2e-i2pd.yml
  # when a revision proves it delivers messages. Dependabot is the safety net
  # for the case where that job has not run or has been failing: it raises the
  # bump as a PR instead, and the same e2e runs on that PR (see the workflow's
  # pull_request trigger), so nothing reaches the pin without having delivered.
  - package-ecosystem: gitsubmodule
    directory: "/"
    schedule:
      interval: weekly
    groups:
      router-sources:
        patterns: ["*"]
