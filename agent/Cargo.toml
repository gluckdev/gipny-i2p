[package]
name = "gipny-agent"
version = "0.4.13"
edition = "2021"
publish = false
description = "Headless Gipny console agent"

[[bin]]
name = "gipny-agent"
path = "src/main.rs"

[dependencies]
gipny-libcore = { path = "../libcore" }
tokio = { workspace = true }
anyhow = "1"
bincode = { workspace = true }

[features]
# The i2pd router inside the process instead of SAM (needs boost, OpenSSL
# and zlib at build time). No SAM, no port, no router process.
embedded-i2p = ["gipny-libcore/embedded-i2p"]
