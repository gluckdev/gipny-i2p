[package]
name = "gipny-dht"
version = "0.1.0"
edition = "2021"
license.workspace = true

# Consumers supply their own persistence through the storage trait.
[dependencies]
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
serde = { version = "1", features = ["derive"] }
serde-big-array = "0.5"
bincode = "1.3"
thiserror = "2"
rand = "0.10"
zeroize = "1"
ed25519-dalek = "3"
x25519-dalek = { version = "3", features = ["static_secrets"] }
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
hkdf = "0.13"
hmac = { version = "0.13", features = ["zeroize"] }
sha2 = { version = "0.11", features = ["zeroize"] }
futures = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
