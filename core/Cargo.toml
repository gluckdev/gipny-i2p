[package]
name = "gipny"
version = "0.4.5"
edition = "2021"

[lib]
name = "gipny_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "gipny"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
image = { version = "0.25", features = ["png", "ico"], default-features = false }

[dependencies]
gipny-libcore = { path = "../libcore" }

tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"

argon2 = { workspace = true }
chacha20poly1305 = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = "1"
# QR of the contact card, rendered here rather than in the interface: one small
# pure-Rust dependency instead of a JavaScript one, and the card never has to
# leave the app to become a picture.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# PDF metadata removal in the attachment sanitizer. Pure Rust; the default
# features (chrono clock, rayon) are not needed for load → edit → save.
lopdf = { version = "0.42", default-features = false }
serde-big-array = { workspace = true }
bincode = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }
libc = { workspace = true }
rusqlite = { workspace = true }
ed25519-dalek = { workspace = true }
x25519-dalek = { workspace = true }
tokio = { workspace = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
arboard = { version = "3", default-features = false, features = ["image-data"] }
png = "0.18"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "linux")'.dependencies]
rodio = { version = "0.22", default-features = false, features = ["wav", "playback"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_UI_Shell",
] }
