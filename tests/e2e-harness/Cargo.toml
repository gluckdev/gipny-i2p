[package]
name = "e2e-harness"
version = "0.1.0"
edition = "2021"
publish = false
description = "End-to-end test harness: two headless bot instances exchange messages through a local relay and report latency."

[[bin]]
name = "e2e-harness"
path = "src/main.rs"

[dependencies]
gipny-libcore = { path = "../../libcore" }
# Only to hand a bot the e2e seed through its saved node table.
gipny-dht = { path = "../../dht" }
tokio = { workspace = true }
anyhow = { workspace = true }

[features]
# Run the bots on the router inside the process, with no SAM.
embedded-i2p = ["gipny-libcore/embedded-i2p"]
