[package]
name = "e2e-harness"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false
description = "End-to-end test harness: two headless bot instances exchange messages through personal I2P terminals and report latency."

[[bin]]
name = "e2e-harness"
path = "src/main.rs"

[dependencies]
gipny-libcore = { path = "../../libcore" }
tempfile = "3"
tokio = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = "1"

