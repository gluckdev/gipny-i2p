[package]
name = "gipny-browser-router"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Experimental browser runtime for the emissary I2P router"

# Keep native application dependencies (Tokio, SQLCipher, OpenSSL) out of WASM.
[workspace]
exclude = ["upstream/emissary", "upstream/emissary/*"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
emissary-core = { path = "upstream/emissary/emissary-core", default-features = false, features = ["std", "events"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
futures = "0.3"
getrandom = { version = "0.4", features = ["wasm_js"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
rand = { version = "0.10", features = ["thread_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = { version = "0.4", default-features = false }
url = "2.5"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["AbortController", "AbortSignal", "BinaryType", "CloseEvent", "Event", "Headers", "MessageEvent", "ReadableStream", "ReadableStreamDefaultReader", "Request", "RequestCache", "RequestCredentials", "RequestInit", "RequestMode", "RequestRedirect", "ReferrerPolicy", "Response", "WebSocket", "Window", "console"] }
web-time = "1.1"
zeroize = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
i2p-embed = { path = "../i2p-embed", optional = true }

[features]
native-peer = ["dep:i2p-embed", "dep:cc"]
ntcp2-live-tests = []
router-live-tests = []

[[bin]]
name = "native-peer"
path = "src/bin/native-peer.rs"
required-features = ["native-peer"]

[[bin]]
name = "collect-netdb"
path = "src/bin/collect-netdb.rs"
required-features = ["native-peer"]

[build-dependencies]
cc = { version = "1", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
