[package]
name = "gipny-forwarder"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"

[workspace]

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["ws", "tokio", "http1"] }
base64 = "0.23"
bytes = "1"
clap = { version = "4", features = ["derive"] }
emissary-core = { path = "../upstream/emissary/emissary-core", default-features = false, features = ["std", "events"] }
futures-util = "0.3"
gipny-browser-router = { path = ".." }
rtc = { version = "=0.21.1", default-features = false, features = ["crypto-ring"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["full"] }
url = "2"
webrtc = "=0.21.1"

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.30"

[profile.release]
# Unwind (the default): tokio confines a panic in webrtc SDP/STUN/DTLS/SCTP
# parsing to its session task instead of aborting every session.
panic = "unwind"
strip = true
