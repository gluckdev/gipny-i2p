[package]
name = "gipny-libcore"
version = "0.1.0"
edition = "2021"

[lib]
name = "gipny_libcore"
path = "src/lib.rs"

[dependencies]
gipny-dht = { path = "../dht" }
futures = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = "1"
serde-big-array = { workspace = true }
bincode = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
ed25519-dalek = { workspace = true }
x25519-dalek = { workspace = true }
chacha20poly1305 = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
argon2 = { workspace = true }
rusqlite = { workspace = true }
yosemite = { workspace = true }
libc = { workspace = true }
# rustls, not native-tls/openssl: no system OpenSSL to fight with when cross
# compiling (see the CC/CXX note for local `cargo check`), and one TLS stack
# instead of two in the dependency tree. Explicit ring provider, not rustls's
# own default (aws-lc-rs): aws-lc-sys needs cmake and a C toolchain per
# target, which the Android cross-compiles (this crate builds into the APK)
# are not set up for; ring is already in this tree and already cross-builds.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Named directly, not just through reqwest's feature: the client is handed a
# rustls config built from these roots, because reqwest's own default is the
# platform verifier, which aborts the process on Android. See `webpki_tls()`.
webpki-roots = "1"
flate2 = "1"
tar = "0.4"
[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
] }